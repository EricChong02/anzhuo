# 远窗配置：复制到 ~/.config/anzhuo/config.toml 再改。完整的每一项说明见 docs/配置参考.md。
# 钉钉密钥和网页密码都不写在这里：macOS 存钥匙串；Windows 下网页密码指纹存本目录旁的 web_hash.json（钉钉密钥暂只支持 macOS）。

# ───────── 入口一：网页（默认开，只听本机端口）─────────
# 本机用不用改；放到外网后改成你的地址（见 docs/外网访问.md），例如 web_base = "https://anzhuo.example.com"
# web_base = "http://127.0.0.1:8765"
# web_port = 8765
# 子路径挂载（可选）：被别的自托管面板反向代理透传（不剥前缀）时，整站挂在它下面，
# 例如面板把 /yuanchuang/* 原样转到 127.0.0.1:8765 就写 web_prefix = "/yuanchuang"。空 = 根路径，默认不变。
# 此时 web_base 填面板的 origin（协议+域名+端口，不含路径）。详见 docs/外网访问.md 方案 D
# web_prefix = ""
# web_user 不用手写：运行 `anzhuo passwd` 会替你写进来

# ───────── 入口二：钉钉（可选，想在钉钉里也能说话才填）─────────
# 不填 client_id 就是只用网页。填法见 docs/钉钉接入.md
# client_id = "钉钉开发者后台“凭证与基础信息”里的 Client ID"
# 只认这些钉钉 ID 发来的单聊消息；用 `anzhuo whoami` 查自己的
# allowed_user_ids = []
# dingtalk = false            # 老写法：client_id 留着但整个停用钉钉（等于不填 client_id）

# ───────── 常用文件夹 ─────────
# 短名 → 路径。网页“新对话”的菜单、钉钉里的“新开 短名：…”都能用。不写也行：网页里有“最近用过的”和手输路径。
# [folders]
# 项目 = "~/Projects/my-app"
# 笔记 = "~/Documents/notes"

# ───────── 干活的方式（都有默认值，按需取消注释）─────────
# max_parallel = 3             # 最多同时几个对话在干活，多的排队
# default_effort = "medium"    # 默认思考深度：low / medium / high / xhigh / max
# 分工表：新开对话没指定模型时，代码仓里按开发档、别处按简单任务档，照下表交给谁（网页 管理 · 设置 里也能改）。
#   use    首选：Claude 的型号 opus / sonnet / haiku / fable，或别家 gpt（Codex）/ deepseek / kimi
#   model  别家自己的型号（如 gpt-5.5-terra、deepseek-v4-pro）；不写 = 它自己默认的。Claude 不用写
#   effort 思考深度 low / medium / high / xhigh / max；不写 = 默认
#   backup 备选：首选没装、没密钥、受限账号不能用、文件夹在 deepseek_block 里时换它；
#          首选那家额度告急或撞线、备选那家更宽裕时也换它（偏紧不换，质量优先）；不写就退回 Claude Sonnet
# 老写法 design_model / dev_model / simple_model 仍然认（没写对应的 [split.xxx] 时）。
# [split.design]               # 拿主意定方案（设计、梳理想法、写方案、架构设计、验收）
# use = "opus"
# [split.dev]                  # 照清楚的要求动手开发（写代码、做功能、改 bug）
# use = "sonnet"
# [split.simple]               # 简单任务（查资料、整理文件、问答、小改动）
# use = "sonnet"
# subagent_model = "sonnet"    # 对话里派出的子代理默认用的模型；写 "" = 跟主对话一样
# relay_long = 120000          # 上下文（token）到这么长就提示接力：越长每句话越贵
# relay_cold = 80000           # 隔一个多小时回来（缓存过期）、上下文又有这么长，也提示接力
# reply_language = "简体中文"   # 让每个对话用什么语言回复；写 "" 表示不指定
# translate_english = false    # 默认关闭。想看中文版的思考过程和英文回复，改成 true：有 DeepSeek 密钥就用它，没有就用 Haiku（会消耗你自己的 Claude 额度）
# extra_instructions = ""      # 你自己的固定要求，会追加给每个对话，例如：“小改动做完直接提交，不用问我”

# ───────── 安全与整理（默认都是保守的）─────────
# auto_review = false          # false：删文件、git push 这类危险命令都等你在网页/手机上点“允许”
#                              # true：交给另一个 AI 审核员判断，它拿不准或出错才问你
# review_policy = ""           # 开了 auto_review 后，写明你额外允许审核员放行什么，例如：“推送到 dev 分支可以放行”
# auto_cleanup = false         # true：每天归档 90 天没动的旧对话记录、清理旧临时文件夹，每月派一次 AI 体检
# timezone = ""                # 定时任务的时区，如 "Asia/Shanghai"；空 = 这台电脑当前的时区

# ───────── 文件夹查找 ─────────
# scratch_root = "~/anzhuo-scratch"   # “不指定文件夹”时的临时文件夹放哪
# search_roots = ["~/Projects", "~/Desktop", "~/Documents", "~/Downloads"]   # “新开 某个词：…”按名字找文件夹的范围
# skip_names = []              # 按名字找时要跳过的文件夹名（前缀匹配），比如放私密资料的
# deepseek_block = ["私密"]       # DeepSeek 对话（内容出境）不许碰的文件夹名（前缀匹配）：在里面不开工，中途碰到也拒掉

# 按任务自动分类（可选，默认关闭）：向模型发送标题、目录末级名称和最多400字摘要。
# 有 DeepSeek 密钥优先用它，失败或没有密钥时用 Haiku；会消耗相应模型额度。
# task_grouping = true

# 总管（可选，默认关闭）：多一个置顶的“总管”对话。你只跟它说要做什么，它替你开新对话派活、
# 把后续的话转给对应对话；它派出去的对话做完、等你定或出错时先回报给它，由它汇总后告诉你。
# 每次回报总管都会多跑一轮，会多消耗额度。
# super_agent = true
# super_agent_name = "管家"     # 总管叫什么，不写就叫“总管”（网页里改名也行，这里写了以这里为准）
# 分派规则：你没点名用哪个引擎 / 模型时，总管照这段话选。能用的引擎和模型总管自己知道（没装的不会列）。
# super_agent_routing = """
# 写代码、改项目：claude，模型 opus
# 查资料、整理文档、翻译：kimi，模型 zhipuai-coding-plan/glm-5.3
# 简单问答、算个数：claude，模型 haiku
# """

# 多账号（可选）：不配时沿用 web_user，一个账号照常使用。
# 必须有且只有一个 admin；受限 user 目前仅支持 macOS，且必须填写独立工作目录。
# 分别运行 scripts/set_account.py 账号名 设置密码后重启。
# [accounts.owner]
# role = "admin"
# [accounts.guest]
# role = "user"
# root = "~/remote-window"
# share = 0.2  # 主账号 Claude 周额度的20%；估算未校准时不能精确限制（老写法 week_share 也认）

# ───────── 扩展 ─────────
# 私有功能放在 src/anzhuo/extensions/名字/，写了 [ext.名字] 这一节才开；enabled = false 关掉。
# [ext.名字]
# enabled = true               # 下面接着写这个扩展自己的配置项
