function watchStatus() {

    const was = prevStatus[s.num];
    if ((was === 'running' || was === 'queued') && !['running', 'queued'].includes(s.status)) notice(s);

}

async function api(path, body) {

function ago(t) {
  const s = Date.now() / 1000 - t, d = new Date(t * 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (new Date().toDateString() === d.toDateString()) return d.toTimeString().slice(0, 5);
  if (s < 2 * 86400) return '昨天';
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function md(src) {
  const lines = esc(src).split('\n'); const out = []; let tbl = [];
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|\/[^)\s]*)\)/g, '<a href="$2" target="_blank">$1</a>');
  const flush = () => {
    if (!tbl.length) return;
    const rows = tbl.filter(r => !/^\|\s*:?-{2,}/.test(r)).map(r => r.replace(/^\||\|$/g, '').split('|'));
    out.push('<table>' + rows.map((r, i) => '<tr>' + r.map(c => `<${i ? 'td' : 'th'}>${inline(c.trim())}</${i ? 'td' : 'th'}>`).join('') + '</tr>').join('') + '</table>');
    tbl = [];
  };
  for (const l of lines) {
    if (/^\s*\|.*\|\s*$/.test(l)) { tbl.push(l.trim()); continue; }
    flush();
    if (/^\s*-{3,}\s*$/.test(l)) continue;
    const h = l.match(/^#{1,4}\s+(.*)/);
    out.push(h ? `<b>${inline(h[1])}</b>` : inline(l.replace(/^(\s*)[-*] /, '$1• ')));
  }
  flush();
  return out.join('\n').replace(/\n(<table>)/g, '$1').replace(/(<\/table>)\n/g, '$1').replace(/\n{3,}/g, '\n\n').trim();
}

async function setupPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  const reg = await navigator.serviceWorker.register('/_x/sw.js', {scope: '/_x/'});
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const subscribe = async () => {
    const {key} = await api('push/key');
    const raw = Uint8Array.from(atob(key.replace(/-/g, '+').replace(/_/g, '/') + '=='.slice(0, (4 - key.length % 4) % 4)), c => c.charCodeAt(0));
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: raw});
    await api('push', sub.toJSON());
  };
  if (Notification.permission === 'granted') return subscribe().catch(() => {});
  if (!standalone || Notification.permission === 'denied') return;
  const b = $('#pushBtn'); b.hidden = false;
  b.onclick = async () => {
    b.querySelector('.nm').textContent = '正在开启…';
    if (await Notification.requestPermission() === 'granted') { await subscribe().catch(() => {}); b.hidden = true; }
    else b.querySelector('.nm').textContent = '没允许通知，可到 设置 → 通知 → 小E 里打开';
  };
}

// 看大图：在页面里盖一层（主屏幕 app 里没有浏览器的返回键，不能跳走）。两指捏合放大、双击放大/还原、放大后单指拖动；
// 没放大时点空白、右上角 ×、返回手势都能关。电脑上滚轮缩放、双击放大。
function viewImage(src) {
  const el = document.createElement('div'); el.className = 'lightbox';
  el.innerHTML = `<img src="${esc(src)}" draggable="false"><button class="x" aria-label="关闭">×</button>`;
  document.body.appendChild(el); history.pushState({lb: 1}, '', location.hash || location.pathname);
  const img = el.querySelector('img');
  let sc = 1, tx = 0, ty = 0, start = null, lastTap = 0, moved = false, closeTimer = 0;
  const W = () => innerWidth / 2, H = () => innerHeight / 2;
  const apply = (anim) => { img.style.transition = anim ? 'transform .2s' : 'none'; img.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
  const zoomAt = (ns, x, y) => {   // 以屏幕上 (x,y) 为中心缩放到 ns 倍
    ns = Math.min(6, Math.max(1, ns)); const cx = x - W(), cy = y - H();
    tx = cx - (cx - tx) * ns / sc; ty = cy - (cy - ty) * ns / sc; sc = ns; if (sc === 1) tx = ty = 0;
  };
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  el.addEventListener('touchstart', e => {
    moved = false;
    if (e.touches.length === 2) start = {d: dist(e.touches), s: sc, x: (e.touches[0].clientX + e.touches[1].clientX) / 2, y: (e.touches[0].clientY + e.touches[1].clientY) / 2, tx, ty};
    else start = {px: e.touches[0].clientX, py: e.touches[0].clientY, tx, ty};
  }, {passive: true});
  el.addEventListener('touchmove', e => {
    e.preventDefault(); moved = true; if (!start) return;
    if (e.touches.length === 2 && start.d) {
      sc = start.s; tx = start.tx; ty = start.ty; zoomAt(start.s * dist(e.touches) / start.d, start.x, start.y);
    } else if (e.touches.length === 1 && sc > 1 && start.px != null) {
      tx = start.tx + e.touches[0].clientX - start.px; ty = start.ty + e.touches[0].clientY - start.py;
    }
    apply(false);
  }, {passive: false});
  el.addEventListener('touchend', e => {
    if (e.touches.length) { start = {px: e.touches[0].clientX, py: e.touches[0].clientY, tx, ty}; return; }
    start = null;
    if (moved) return;
    const t = e.changedTouches[0], now = Date.now();
    if (now - lastTap < 300) { clearTimeout(closeTimer); zoomAt(sc > 1 ? 1 : 2.5, t.clientX, t.clientY); apply(true); lastTap = 0; e.preventDefault(); }
    else lastTap = now;
  });
  el.addEventListener('wheel', e => { e.preventDefault(); zoomAt(sc * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY); apply(false); }, {passive: false});
  el.addEventListener('dblclick', e => { clearTimeout(closeTimer); zoomAt(sc > 1 ? 1 : 2.5, e.clientX, e.clientY); apply(true); });
  el.onclick = e => {
    if (e.target.closest('.x')) return history.back();
    if (e.target === img || sc > 1) return;
    clearTimeout(closeTimer); closeTimer = setTimeout(() => { if (sc === 1) history.back(); }, 320);   // 等等看是不是双击
  };
}

function renderThread(d) {

  d.items.forEach(i => { if (i.pending) i.cls = 'pending'; });
  pending[d.num] = (pending[d.num] || []).filter(p => !said.has(p.text.trim()));
  const replies = d.items.filter(i => i.who === 'claude');
  const keep = new Set(replies.slice(-2));
  let h = d.items.map((it, idx) => {
    if (it.who === 'you') return `<div class="you ${it.pending ? 'pending' : ''}">${esc(it.text)}</div>`;
    if (it.who === 'note') return `<div class="note">${esc(it.text)}</div>`;
    const acts = [it.tid ? `<a class="pill" href="/_x/t/${it.tid}" target="_blank">${ICON.list}过程</a>` : '',
      ...(it.previews || []).map(([n, u]) => `<a class="pill" href="${esc(u)}" target="_blank">${ICON.play}试课</a>`)].join('');
    const id = d.num + ':' + idx, fold = !keep.has(it) && it.text.length > 700 && !opened.has(id);

    const files = (it.files || []).map(f => `<a class="file" href="${esc(f.url)}" download>${ICON.doc}<span class="fn">${esc(f.name)}</span><span class="fs">${size(f.size)}</span></a>`).join('');
    const proc = it.process && it.process.length ? (() => {
      const pid = d.num + ':p' + idx, op = openProc.has(pid), thinks = it.process.filter(e => e.k === 'think').length;
      return `<button class="ptog ${op ? 'open' : ''}" data-p="${pid}">${ICON.chev}工作过程 · ${it.steps} 步${thinks ? ' · 含思考' : ''}</button>${op ? procHTML(it.process) : ''}`;
    })() : '';

  }).join('');

      <button class="stop" id="stop">${ICON.stop}停止</button></div>
      ${(L.process || []).length ? procHTML(L.process.slice(-14)) : L.steps.length ? `<ol>${L.steps.map((x, i) => `<li><i>${first + i}</i>${esc(x)}</li>`).join('')}</ol>` : ''}</div>`;
  }
  if (d.decision) h += `<div class="ask"><div class="q">${esc(d.decision.question)}</div>${d.decision.options.map(([k, v]) =>
      `<button class="opt ${k === d.decision.recommend ? 'rec' : ''}" data-k="${k}" data-v="${esc(v)}"><span class="k">${k}</span><span class="v">${esc(v)}</span>${k === d.decision.recommend ? '<span class="tag">推荐</span>' : ''}</button>`).join('')}</div>`;
  $('#col').innerHTML = h;
  document.querySelectorAll('.more').forEach(b => b.onclick = () => { opened.add(b.dataset.id); lastKey = ''; renderThread(d); });
  document.querySelectorAll('.ptog').forEach(b => b.onclick = () => { const k = b.dataset.p; openProc.has(k) ? openProc.delete(k) : openProc.add(k); lastKey = ''; renderThread(d); });
  document.querySelectorAll('.clamp').forEach(c => c.onclick = () => c.classList.toggle('clamp'));
  const lp = document.querySelector('.live .plist'); if (lp) lp.scrollTop = lp.scrollHeight;
  const q = $('#quick');
  const quick = d.live ? [] : d.decision ? [] : d.awaiting ? ['好的', '就按你推荐的', '先不做'] : [];
  q.hidden = !quick.length;
  q.innerHTML = quick.map(t => `<button>${t}</button>`).join('');
  q.querySelectorAll('button').forEach(b => b.onclick = async () => {
    q.hidden = true; (pending[d.num] ||= []).push({text: b.textContent, t: Date.now()}); lastKey = ''; renderThread(d);
    await api('send', {num: d.num, text: b.textContent}); loadThread(); loadSessions();
  });
  const last = [...d.items].reverse().find(it => it.who === 'claude' && (it.previews || []).length);
  renderUsage(d.usage);
  if (!mpOpen && d.usage) renderModel({model: d.usage.mkey || 'opus', effort: d.usage.ekey || 'medium'}, st => api('settings/' + sel, st), false);
  $('#headActs').innerHTML = last ? `<a class="pill" href="${esc(last.previews[0][1])}" target="_blank">${ICON.play}试课</a>` : '';
  $('#ta').placeholder = d.live ? '插话：它手上这一步做完就会看到' : d.awaiting ? '回答它的问题…' : '说点什么…';
  if ($('#stop')) $('#stop').onclick = async e => { e.currentTarget.innerHTML = '<i class="spin"></i>停止中'; e.currentTarget.disabled = true; await api('stop/' + d.num, {}); loadThread(); };
  document.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
    document.querySelectorAll('.opt').forEach(x => x.disabled = true);
    b.querySelector('.k').innerHTML = '<i class="spin"></i>';
    const text = `选 ${b.dataset.k}：${b.dataset.v}`;
    (pending[d.num] ||= []).push({text, t: Date.now()});
    await api('send', {num: d.num, text}); lastKey = ''; loadThread(); loadSessions();
  });
  if (near) feed.scrollTop = feed.scrollHeight;
}

async function loadThread() {
  if (!sel) return;
  try {
    const d = await api('thread/' + sel);
    if (d.num !== sel) return;
    const key = JSON.stringify(d) + JSON.stringify(pending[d.num] || []);
    if (key !== lastKey) { lastKey = key; renderThread(d); }
  } catch (e) { if (e.message !== 'login') console.warn(e); }
}

function shrink(file) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', .86));
    };
    img.src = url;
  });
}

function wireComposer(sendFn, onSent) {
  const ta = $('#ta'), btn = $('#send');
  const sync = () => {
    ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, innerHeight * .38) + 'px';
    btn.disabled = sending || (!ta.value.trim() && !attach.length && !attachFiles.length);
    $('#thumbs').hidden = !attach.length && !attachFiles.length;
    $('#thumbs').innerHTML = attach.map((u, i) => `<span class="thumb"><img src="${u}"><button data-i="${i}">×</button></span>`).join('')
      + attachFiles.map((f, i) => `<span class="thumb chipf">${ICON.doc}<span>${esc(f.name)}</span><button data-f="${i}">×</button></span>`).join('');
    document.querySelectorAll('.thumb button[data-i]').forEach(b => b.onclick = () => { attach.splice(+b.dataset.i, 1); sync(); });
    document.querySelectorAll('.thumb button[data-f]').forEach(b => b.onclick = () => { attachFiles.splice(+b.dataset.f, 1); sync(); });
  };
  const warn = t => { $('#warn').hidden = !t; $('#warn').textContent = t || ''; };
  const readFile = f => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
  const add = async files => {
    for (const f of files) {
      if (/^image\/(png|jpe?g|gif|webp|heic|heif)$/.test(f.type)) attach.push(await shrink(f));
      else if (f.size > 100 * 1048576) warn(`${f.name} 超过 100MB，传不了`);
      else attachFiles.push({name: f.name, size: f.size, data: await readFile(f)});
    }
    sync();
  };
  ta.oninput = sync;
  $('#file').onchange = e => add(e.target.files);
  ta.onpaste = e => { const fs = [...e.clipboardData.items].filter(i => i.type.startsWith('image/')).map(i => i.getAsFile()); if (fs.length) add(fs); };
  // 回车发送（iPad 连不连键盘都算、电脑也是），Shift+回车换行；打中文选字时的回车不算。只有手机上回车是换行。
  const phone = matchMedia('(pointer:coarse) and (max-width:600px)').matches;
  ta.setAttribute('enterkeyhint', phone ? 'enter' : 'send');
  ta.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && !phone) { e.preventDefault(); go(); }
  };
  async function go() {
    const text = ta.value.trim();
    if ((!text && !attach.length && !attachFiles.length) || sending) return;
    sending = true; warn(''); btn.disabled = true; btn.innerHTML = '<i class="spin"></i>';
    // 一按发送就先显示在对话里（长文字带图上传要几秒），没发出去再撤回
    const shown = text || (attachFiles.length ? '[附件]' : '[图片]'), num0 = sel;
    if (onSent) { onSent(shown); lastKey = ''; loadThread(); }
    const undo = () => { if (num0 && pending[num0]) pending[num0] = pending[num0].filter(p => p.text !== shown); lastKey = ''; loadThread(); };
    try {
      const r = await sendFn(text);
      if (r.ok) {
        ta.value = ''; attach = []; attachFiles = [];
        if (r.num) { sending = false; await loadSessions(); openSession(r.num); return; }
      } else { undo(); warn(r.error || '没发出去，再试一次'); }
    } catch (e) { undo(); if (e.message !== 'login') warn('没发出去，再试一次'); }
    sending = false; btn.innerHTML = ICON.up; sync(); lastKey = ''; loadThread(); loadSessions();
  }
  btn.onclick = go; sync();
}

const WHERE_ICON = {
  auto: '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
  course: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="m10 8.5 4 2-4 2z"/></svg>',
  folder: '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  plat: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10"/><path d="M7 8h6M7 12h10"/></svg>',
  chat: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>',
};
const FOLDER_SAY = {  // 设置里的文件夹短名 → 说人话；没列的按原名放在菜单最后
  '课程根': ['folder', '做新课或别的课', '课程文件夹'],
  '平台': ['plat', '改上课平台', '教师台、学生端、小信'],
};
function ago(t) {
  const d = Math.floor((Date.now() / 1000 - t) / 86400);
  return d < 1 ? '今天动过' : d < 2 ? '昨天动过' : `${d} 天前动过`;
}
// 新对话：和 Claude / ChatGPT 一样只有一个输入框；“在哪做”是输入框下面一个小按钮，默认小E 自动判断，要改才点开
function openNew(fromPop) {
  sel = null; if (!fromPop) history.pushState({n: 1}, '', '#new'); $('#app').classList.add('in'); renderSide();
  const said = Object.keys(FOLDER_SAY);
  const opts = [{v: 'auto', ic: 'auto', t: '自动', d: '小E 看你说的话选地方'},
    ...drafts.slice(0, 3).map(x => ({v: 'c:' + x.dir, ic: 'course', t: `接着做《${x.title}》`, d: ago(x.mtime)})),
    ...said.filter(f => folders.includes(f)).map(f => ({v: f, ic: FOLDER_SAY[f][0], t: FOLDER_SAY[f][1], d: FOLDER_SAY[f][2]})),
    {v: 'scratch', ic: 'chat', t: '不碰文件', d: '查资料、问问题'},
    ...folders.filter(f => !said.includes(f)).map(f => ({v: f, ic: 'folder', t: f, d: '文件夹'}))];
  let pick = 'auto', menu = false;
  $('#main').innerHTML = `<div class="head"><button class="icon-btn back" id="back">${ICON.back}</button><div class="ti"><b>新对话</b></div></div>
    <div class="newv"><h1>要做什么？</h1>${composerHTML('说说要做什么')}<div class="wbar" id="wbar"></div></div>`;
  $('#back').onclick = () => history.state && history.state.n ? history.back() : goList();
  const draw = () => {
    const cur = opts.find(o => o.v === pick), last = drafts[0] && opts.find(o => o.v === 'c:' + drafts[0].dir);
    $('#wbar').innerHTML = `<button class="pill ${pick !== 'auto' ? 'on' : ''}" id="wp">${WHERE_ICON[cur.ic]}<span>${esc(cur.v === 'auto' ? '在哪做：自动' : cur.t)}</span>${ICON.chev.replace('<svg', '<svg style="transform:rotate(90deg)"')}</button>`
      + (pick === 'auto' && last ? `<button class="pill" id="wlast">${WHERE_ICON.course}<span>${esc(last.t)}</span></button>` : '')
      + (menu ? `<div class="wmenu">${opts.map(o => `<button class="wo ${o.v === pick ? 'on' : ''}" data-v="${esc(o.v)}">${WHERE_ICON[o.ic]}
          <span class="tx"><b>${esc(o.t)}</b><small>${esc(o.d)}</small></span></button>`).join('')}</div>` : '');
    $('#wp').onclick = e => { e.stopPropagation(); menu = !menu; draw(); };
    if ($('#wlast')) $('#wlast').onclick = () => { pick = last.v; draw(); $('#ta').focus(); };
    document.querySelectorAll('.wo').forEach(c => c.onclick = e => { e.stopPropagation(); pick = c.dataset.v; menu = false; draw(); });
  };
  draw();
  $('#main').onclick = e => { if (menu && !e.target.closest('.wmenu')) { menu = false; draw(); } };
  const ms = {model: 'auto', effort: 'medium'}; let touched = false;
  renderModel(ms, () => { touched = true; }, true);
  const extra = () => ({...(ms.model !== 'auto' ? {model: ms.model} : {}), ...(touched ? {effort: ms.effort} : {})});
  wireComposer(text => api('send', {...(pick.startsWith('c:') ? {course: pick.slice(2)} : {folder: pick}), ...extra(), text, images: attach, files: attachFiles}));
  if (!matchMedia('(max-width:600px) and (pointer:coarse)').matches) $('#ta').focus();
}
$('#newBtn').onclick = () => openNew();
$('#fab').onclick = () => openNew();

// 屏幕键盘（或妙控键盘的悬浮快捷条）挡住底部时：页面保持满屏，只把输入条往上挪被挡住的那么多；
// 整页不滚，Safari 为露出输入框滚走的那段拉回来（不然会卡在半截、下面一片空白）
if (window.visualViewport) {
  const vv = visualViewport;
  const fit = () => {
    if (scrollX || scrollY) scrollTo(0, 0);
    // 用布局高度（clientHeight）算：iPhone 的 Safari 里 innerHeight 会跟着键盘一起变矮，拿它算会得 0
    const full = document.documentElement.clientHeight || innerHeight;
    const kb = Math.max(0, Math.round(full - vv.height - vv.offsetTop));
    document.documentElement.style.setProperty('--kb', kb + 'px');
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
  addEventListener('focusout', () => setTimeout(fit, 60));
}

(async () => {
  await loadSessions();
  const m = location.hash.match(/^#s(\d+)/);
  if (await openFromNotice()) {} else if (m) { history.replaceState(null, '', location.pathname); openSession(+m[1]); } else if (location.hash === '#new') { history.replaceState(null, '', location.pathname); openNew(); }
  setInterval(() => { if (!document.hidden) loadSessions(); }, 4000);
  setInterval(() => { if (!document.hidden) loadThread(); }, 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadSessions(); loadThread(); openFromNotice(); } });
})();
