<style>
[hidden]{display:none!important}
:root{--bg:#fafaf9;--side:#f2f2ef;--panel:#fff;--bubble:#ececE8;--ink:#1c1c1e;--mute:#6b6b70;--line:rgba(0,0,0,.08);
  --acc:#2f6fdf;--accsoft:rgba(47,111,223,.10);--amber:#c58a06;--red:#c0392b;--green:#1f9d55;--glass:rgba(255,255,255,.78);--shadow:0 6px 24px rgba(0,0,0,.06)}

  --acc:#7aa7ff;--accsoft:rgba(122,167,255,.14);--amber:#f5c04a;--red:#f08070;--green:#4ade80;--glass:rgba(34,34,34,.78);--shadow:0 6px 24px rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}

.app{display:grid;grid-template-columns:296px 1fr;height:100dvh}

/* 侧栏 */
.side{background:var(--side);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;padding:18px 14px 10px 20px}

.label{font-size:14px;color:var(--mute);padding:14px 10px 6px}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border-radius:10px;padding:9px 10px;color:var(--ink)}
.item:hover{background:var(--line)} .item.sel{background:var(--accsoft)}
.item .tx{min-width:0;flex:1}
.item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
.item.sel .nm{font-weight:600}

.dot{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--mute);flex:none}

.eng{display:inline-block;font-size:12px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-right:6px;vertical-align:2px} .qrow .bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}

.pill.warn{color:var(--amber);border-color:var(--amber)}
.notice{position:fixed;left:50%;top:calc(78px + env(safe-area-inset-top));transform:translate(-50%,-24px);opacity:0;z-index:20;display:flex;align-items:center;gap:10px;
  max-width:min(92vw,440px);padding:10px 16px;border-radius:16px;background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);
  border:1px solid var(--line);box-shadow:var(--shadow);font-size:15px;transition:transform .25s ease,opacity .25s,visibility .25s;cursor:pointer;visibility:hidden}
.notice.on{transform:translate(-50%,0);opacity:1;visibility:visible} .notice .dot{flex:none} .notice span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usage{position:absolute;right:16px;top:60px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 16px;min-width:250px;font-size:15px}
.usage div{display:flex;justify-content:space-between;gap:20px;padding:4px 0} .usage div span{color:var(--mute)} .usage .w{color:var(--amber)}
.usage .r{font-size:14px;color:var(--mute);display:block;padding:0 0 4px}

/* 主区 */

.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--panel);font-size:14.5px;color:var(--ink)}

.back{display:none}
.feed{flex:1;overflow:auto;padding:24px 20px calc(150px + var(--kb,0px));scroll-behavior:auto}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.cl{line-height:1.75;word-break:break-word}
.cl .md{white-space:pre-wrap}

.plist{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.6}
.pi{display:flex;gap:10px;align-items:flex-start} .pi>svg{width:16px;height:16px;margin-top:4px;color:var(--mute)}

.yimgs{margin:0 0 6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end} .yimgs img{width:92px;height:92px;object-fit:cover;border-radius:10px;display:block}

.live .plist{margin:10px 0 0;max-height:46vh;overflow:auto;background:var(--bg)}
.cl .md table{border-collapse:collapse;margin:8px 0;white-space:normal;font-size:15px;display:block;overflow-x:auto}

.note{align-self:center;font-size:14px;color:var(--mute)}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px} .imgs img{max-width:min(100%,360px);max-height:300px;border-radius:12px;border:1px solid var(--line);display:block}
.file{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-top:8px;color:var(--ink);max-width:440px}
.file:hover{border-color:var(--acc)} .file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .file .fs{color:var(--mute);font-size:14px;flex:none}

.chipf{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px;max-width:220px;position:relative}

code{font:14px ui-monospace,Menlo,monospace;background:var(--line);padding:1px 5px;border-radius:5px}
.live{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}

  border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:8px}

/* 字在上面占满整行，附件 / 模型 / 发送在下面一排（像 Claude 手机版），字不会被挤成窄条 */
.composer textarea{display:block;width:100%;box-sizing:border-box;border:0;outline:none;background:transparent;font:inherit;font-size:16px;color:var(--ink);resize:none;padding:8px 8px 4px;max-height:30vh;min-height:40px;line-height:1.5}
.lightbox{position:fixed;inset:0;z-index:50;touch-action:none;background:rgba(0,0,0,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;overflow:hidden}

  font-size:16px;font-weight:600;display:flex;align-items:center;gap:4px;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.lightbox .x b{font-size:26px;line-height:1;font-weight:400}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet .box{width:min(340px,100%);background:var(--panel);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.sheet b{display:block;font-size:17px;margin-bottom:4px} .sheet p{margin:0 0 14px;color:var(--mute);font-size:15px}

.devs{max-height:46vh;overflow:auto;margin:0 -4px 6px}

.mp:hover,.mp.open{background:var(--line);color:var(--ink)} .mp svg{width:14px;height:14px;transform:rotate(90deg)}
.mmenu{position:absolute;right:-44px;bottom:calc(100% + 12px);z-index:20;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px}

.send{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}

  padding:24px 16px calc(24px + var(--kb,0px));transition:padding-bottom .15s}

.wo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;color:var(--ink)}
.wo:hover{background:var(--line)} .wo.on{color:var(--acc)}

</style></head><body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><b>小E</b><button class="icon-btn" id="newBtn" title="新对话"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></div>
    <div class="scroll"><button class="item" id="pushBtn" hidden><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="nm">开启手机通知</span></button><div id="courses"></div><div id="list"></div>
      <a class="item" href="/_x/history" style="margin-top:12px"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg><span class="nm">历史记录</span></a>
      <button class="item" id="logoutBtn"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="13" height="10" rx="1.5"/><path d="M5 19h7"/><rect x="17" y="8" width="5" height="11" rx="1.2"/></svg><span class="nm">登录的设备</span></button>
    </div>
    <div class="quota" id="quota" hidden></div>
  </aside>
  <button class="fab" id="fab" title="新对话"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <section class="main" id="main"><div class="blank"><b>小E</b>选一个对话，或开个新的</div></section>
</div>
<div class="notice" id="notice"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></svg>',
  list: '<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  img: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
  clip: '<svg viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7L10.2 17.2a1.7 1.7 0 0 1-2.4-2.4L15 7.6"/></svg>',
  doc: '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  chev: '<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
  bulb: '<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
  step: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>',
  say: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>',
};
let openProc = new Set();
// 工作过程：展开过的思考记在 unclamp 里（按内容认），重画时保持展开；还在翻译的显示“翻译中…”，译好一次出中文
const unclamp = new Set();
function procHTML(list, pid) {
  const ck = t => esc(String(t).slice(0, 80));
  return `<div class="plist" data-pid="${esc(pid)}">${list.map(e => e.wait
    ? `<div class="pi ${e.k}">${e.k === 'think' ? ICON.bulb : ICON.say}<span class="pt wait">翻译中…</span></div>`
    : e.k === 'think' ? `<div class="pi think">${ICON.bulb}<span class="pt ${unclamp.has(ck(e.text)) ? '' : 'clamp'}" data-c="${ck(e.text)}">${esc(e.text)}</span></div>`
    : e.k === 'say' ? `<div class="pi say">${ICON.say}<span class="pt">${md(e.text)}</span></div>`
    : `<div class="pi do">${ICON.step}<span class="pt"><b>${esc(e.text)}</b>${e.detail && e.detail !== e.text ? `<code class="pd ${unclamp.has(ck(e.detail)) ? '' : 'clamp'}" data-c="${ck(e.detail)}">${esc(e.detail)}</code>` : ''}</span></div>`).join('')}</div>`;
}
let limitsGpt = [], hasGpt = false;
let attachFiles = [], limits = [], usageOpen = false, prevStatus = null, noticeTimer = null;

// 网页里的提醒：某个对话做完、等你回答或出错时，顶上轻轻弹一条（点一下进去）；标签页标题写着几件要你看
function notice(s) {
  const el = $('#notice'), word = {awaiting: (s.detail || '').startsWith('等你确认') ? '等你确认' : '等你回答', error: '出错了', idle: '做完了'}[s.status] || '有新进展';
  el.className = 'notice ' + s.status;
  el.innerHTML = `<span class="dot"></span><span>${esc(s.name)} · ${word}</span>`;
  el.onclick = () => { el.classList.remove('on'); openSession(s.num); };
  requestAnimationFrame(() => el.classList.add('on'));
  clearTimeout(noticeTimer); noticeTimer = setTimeout(() => el.classList.remove('on'), 5000);
}
function watchStatus() {
  const now = Object.fromEntries(sessions.map(s => [s.num, s.status]));
  if (prevStatus) for (const s of sessions) {
    const was = prevStatus[s.num];
    if ((was === 'running' || was === 'queued') && !['running', 'queued'].includes(s.status)) notice(s);
  }
  prevStatus = now;
  const n = sessions.filter(s => s.status === 'awaiting' || s.status === 'error' || (s.unread && s.num !== sel)).length;
  document.title = n ? `(${n}) 小E` : '小E';
}
const size = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
let sessions = [], folders = [], drafts = [], sel = null, lastKey = '', attach = [], sending = false, pending = {}, opened = new Set();

// Mac 连不上（睡着、断网、小E 在更新）时阿里云回 502/504 或干脆不通：顶上挂一条提示，连上了自己消失
function setOffline(off) {
  let el = $('#offline');
  if (!off) { if (el) el.remove(); return; }
  if (el) return;
  el = document.createElement('div'); el.id = 'offline'; el.className = 'offline';
  el.innerHTML = '<i></i>连不上 Mac：可能睡着、断网，或小E 正在更新。连上后自动恢复';
  document.body.appendChild(el);
}
async function api(path, body) {
  let r;
  try { r = await fetch('/_x/api/' + path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {}); }
  catch (e) { setOffline(true); throw e; }
  if (r.status === 401) { location.href = '/_x/login?next=' + encodeURIComponent('/_x/' + location.hash); throw new Error('login'); }
  if (r.status === 502 || r.status === 503 || r.status === 504) { setOffline(true); throw new Error('offline'); }
  setOffline(false);
  return r.json();
}

function ago(t) {
  const s = Date.now() / 1000 - t, d = new Date(t * 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (new Date().toDateString() === d.toDateString()) return d.toTimeString().slice(0, 5);
  if (s < 2 * 86400) return '昨天';
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
const statusText = s => ({running: (s.detail || '').startsWith('正在压缩') ? '正在压缩上下文' : `在做 · 第 ${s.steps} 步`, queued: '排队中', awaiting: (s.detail || '').startsWith('等你确认') ? '等你确认' : '等你回答', error: '出错了'}[s.status]
  || (s.unread ? '做完了 · ' + ago(s.updated) : ago(s.updated)));

function md(src) {
  const lines = esc(src).split('\n'); const out = []; let tbl = [];
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|\/[^)\s]*)\)/g, '<a href="$2" target="_blank">$1</a>');
  const flush = () => {
    if (!tbl.length) return;
    const rows = tbl.filter(r => !/^\|\s*:?-{2,}/.test(r)).map(r => r.replace(/^\||\|$/g, '').split('|'));
    out.push('<table>' + rows.map((r, i) => '<tr>' + r.map(c => `<${i ? 'td' : 'th'}>${inline(c.trim())}</${i ? 'td' : 'th'}>`).join('') + '</tr>').join('') + '</table>');
    tbl = [];
  };
  for (const l of lines) {
    if (/^\s*\|.*\|\s*$/.test(l)) { tbl.push(l.trim()); continue; }
    flush();
    if (/^\s*-{3,}\s*$/.test(l)) continue;
    const h = l.match(/^#{1,4}\s+(.*)/);
    out.push(h ? `<b>${inline(h[1])}</b>` : inline(l.replace(/^(\s*)[-*] /, '$1• ')));
  }
  flush();
  return out.join('\n').replace(/\n(<table>)/g, '$1').replace(/(<\/table>)\n/g, '$1').replace(/\n{3,}/g, '\n\n').trim();
}

function renderQuota() {
  // 额度：Claude 一组；用过 GPT 再加一组（各自的 5 小时 / 本周）
  const q = $('#quota'), both = limitsGpt.length && hasGpt;
  q.hidden = !limits.length && !both;
  const rows = (ls, who) => ls.map(l => `<div class="qrow ${l.pct >= 80 ? 'warn' : ''}" title="${l.reset ? esc(l.reset) + ' 重置' : ''}"><span>${who ? `<em>${who}</em>` : ''}${esc(l.name)}</span>
    <span class="bar"><i style="width:${Math.min(100, l.pct)}%"></i></span><b>${l.pct}%</b></div>`).join('');
  q.innerHTML = both ? rows(limits, 'Claude') + rows(limitsGpt, 'GPT') : rows(limits, '');
  q.classList.toggle('two', !!both);
}

function renderUsage(u) {
  const el = $('#usageBox'); if (!el || !u) return;
  const ctxWarn = u.context != null && u.context >= 70;
  const ls = u.mkey === 'gpt' ? limitsGpt : limits;
  const warn = ctxWarn || ls.some(l => l.pct >= 80);
  el.innerHTML = `<button class="pill ${warn ? 'warn' : ''}" id="usagePill">${u.context != null ? `<span class="um">上下文 </span>${u.context}%` : '用量'}</button>`
    + (usageOpen ? `<div class="usage"><div class="${ctxWarn ? 'w' : ''}"><span>上下文</span>${u.context != null ? u.context + '%' : '—'}</div>
      ${ls.map(l => `<div class="${l.pct >= 80 ? 'w' : ''}"><span>${u.mkey === 'gpt' ? 'GPT ' : ''}${esc(l.name)}额度</span>${l.pct}%</div>${l.reset ? `<span class="r">${esc(l.reset)} 重置</span>` : ''}`).join('')}
      ${ctxWarn ? '<div class="w" style="display:block">上下文过七成，再长会自动压缩</div>' : ''}
      <button class="pill" id="compactBtn" style="width:100%;justify-content:center;margin-top:8px" ${u.compacting || u.busy ? 'disabled' : ''}>${
        u.compacting === 'running' ? '<i class="spin"></i>正在压缩，大约一分钟' : u.compacting === 'queued' ? '已排队：手上的做完就压'
        : u.busy ? '它在干活，做完才能压缩' : '压缩上下文'}</button></div>` : '');
  $('#usagePill').onclick = e => { e.stopPropagation(); usageOpen = !usageOpen; renderUsage(u); };
  if ($('#compactBtn')) $('#compactBtn').onclick = async e => {
    e.stopPropagation(); const b = e.currentTarget; b.disabled = true; b.innerHTML = '<i class="spin"></i>压缩中';
    const r = await api('compact/' + sel, {}).catch(() => null); b.textContent = r ? '已交给它，进度看对话里' : '没交出去，再点一次';
    lastKey = ''; loadThread();
  };
}
document.addEventListener('click', e => { if (usageOpen && !e.target.closest('.usage')) { usageOpen = false; lastKey = ''; loadThread(); } });

function renderSide() {
  $('#courses').innerHTML = drafts.length ? '<div class="label">在做的课</div>' + drafts.map(x =>
    `<a class="item course" href="${esc(x.url)}" target="_blank">${ICON.play}<span class="tx"><div class="nm">${esc(x.title)}</div></span></a>`).join('') : '';
  const row = s => `<button class="item ${s.status} ${s.unread && s.num !== sel ? 'unread' : ''} ${s.num === sel ? 'sel' : ''}" data-n="${s.num}">
      <span class="tx"><div class="nm">${s.engine === 'codex' ? '<span class="eng">GPT</span>' : ''}${esc(s.name)}</div><div class="st"><span class="dot"></span>${esc(statusText(s))}</div></span></button>`;
  const groups = [['需要你', s => ['awaiting', 'error'].includes(s.status)], ['在做', s => ['running', 'queued'].includes(s.status)],
    ['新完成', s => s.status === 'idle' && s.unread && s.num !== sel], ['其他', s => s.status === 'idle' && !(s.unread && s.num !== sel)]]
    .map(([t, f]) => [t, sessions.filter(f)]).filter(([, xs]) => xs.length);
  $('#list').innerHTML = groups.map(([t, xs]) => (groups.length > 1 || t !== '其他' ? `<div class="label">${t}</div>` : '') + xs.map(row).join('')).join('')
    || '<div class="note" style="padding:10px">还没有对话</div>';
  document.querySelectorAll('#list .item').forEach(b => b.onclick = () => openSession(+b.dataset.n));
}

async function loadSessions() {
  try { const d = await api('sessions'); sessions = d.sessions; folders = d.folders; drafts = d.drafts; limits = d.limits || []; limitsGpt = d.limits_gpt || []; hasGpt = !!d.has_gpt; renderSide(); renderQuota(); headStatus(); watchStatus(); }
  catch (e) { if (e.message !== 'login') console.warn(e); }
}

function composerHTML(ph) {
  return `<div class="dock"><div style="text-align:center"><button class="jump" id="jump">${ICON.down}最新</button></div><div class="quick" id="quick" hidden></div><div class="composer"><div class="warn" id="warn" hidden></div><div class="thumbs" id="thumbs" hidden></div>
    <textarea id="ta" rows="1" placeholder="${esc(ph)}"></textarea>
    <div class="row"><label class="icon-btn" title="图片或文件">${ICON.clip}<input type="file" multiple id="file" hidden></label>
    <span class="gap"></span><span class="mpw" id="mpw"></span><button class="send" id="send" disabled title="发送">${ICON.up}</button></div></div></div>`;
}

// 选模型和思考深度：和 Claude 一样放在输入框里、发送键左边。新对话多一个“自动”（做课开发用 Opus、简单事用 Sonnet）
const MODEL_OPTS = [['opus', 'Opus', '最强，做课和开发'], ['sonnet', 'Sonnet', '快一些，日常事够用'], ['haiku', 'Haiku', '最快最省，简单问答']];
const EFFORT_OPTS = [['low', '低'], ['medium', '中'], ['high', '高'], ['xhigh', '很高'], ['max', '最高']];
let mpOpen = false, mpRedraw = null;
function renderModel(st, onPick, isNew) {
  const el = $('#mpw'); if (!el) return;
  mpRedraw = () => renderModel(st, onPick, isNew);
  const GPT = ['gpt', 'GPT', 'ChatGPT 自带的 Codex，用会员额度；聊天、干活都行'];
  const mname = st.model === 'auto' ? '自动' : ([...MODEL_OPTS, GPT].find(m => m[0] === st.model) || [, '默认'])[1];
  const models = isNew ? [['auto', '自动', '做课开发用 Opus，简单事用 Sonnet'], ...MODEL_OPTS, GPT]
    : st.model === 'gpt' ? [[...GPT.slice(0, 2), '这个对话用 GPT，不能中途换成 Claude']] : MODEL_OPTS;
  const ename = (EFFORT_OPTS.find(e => e[0] === st.effort) || [, '中'])[1];
  const ok = '<svg class="ok" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" stroke="currentColor" fill="none" stroke-width="2.2"/></svg>';
  el.innerHTML = `<button class="mp ${mpOpen ? 'open' : ''}" id="mp" title="模型和思考深度">${esc(mname)} · ${esc(ename)}${ICON.chev}</button>`
    + (mpOpen ? `<div class="mmenu"><div class="lb">模型</div>
      ${models.map(([k, t, d]) =>
        `<button class="mo ${k === st.model ? 'on' : ''}" data-m="${k}"><span class="tx"><b>${t}</b><small>${d}</small></span>${ok}</button>`).join('')}
      <div class="lb">思考深度</div><div class="seg">${EFFORT_OPTS.map(([k, t]) => `<button class="${k === st.effort ? 'on' : ''}" data-e="${k}">${t}</button>`).join('')}</div>
      <div class="tip">${isNew ? '越高想得越细，也越慢、越费额度' : '从下一轮起生效'}</div></div>` : '');
  $('#mp').onclick = e => { e.stopPropagation(); mpOpen = !mpOpen; renderModel(st, onPick, isNew); };
  el.querySelectorAll('[data-m],[data-e]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    if (b.dataset.m) { st.model = b.dataset.m; mpOpen = false; } else st.effort = b.dataset.e;
    onPick(st); renderModel(st, onPick, isNew);
  });
}
document.addEventListener('click', e => { if (mpOpen && !e.target.closest('.mpw')) { mpOpen = false; mpRedraw && mpRedraw(); } });

function headStatus() {
  const s = sessions.find(x => x.num === sel), el = $('#hst');
  if (!s || !el) return;
  el.className = s.status; el.textContent = s.status === 'idle' ? s.cwd.split('/').filter(Boolean).pop() || s.cwd : statusText(s);
}

// 历史只留一层：列表 → 某个对话。已经在对话（或新对话页）里再切到别的，就替换当前这一层，返回一次就回到列表
function navTo(state, hash) {
  const st = history.state;
  if (st && (st.s || st.n)) history.replaceState(state, '', hash); else history.pushState(state, '', hash);
}
function openSession(num, fromPop) {
  partialText = ''; setTimeout(connectEvents);
  sel = num; lastKey = ''; attach = []; attachFiles = [];
  if (!fromPop) navTo({s: num}, '#s' + num);
  $('#app').classList.add('in');
  const s = sessions.find(x => x.num === num) || {name: '#' + num, cwd: ''};
  $('#main').innerHTML = `<div class="head"><button class="icon-btn back" id="back">${ICON.back}</button>
      <div class="ti"><b>${esc(s.name)}</b><span id="hst"></span></div><span id="usageBox"></span><span id="headActs"></span></div>
    <div class="feed" id="feed"><div class="col" id="col"><div class="note">读取中…</div></div></div>
    ${composerHTML('说点什么…')}`;
  $('#back').onclick = () => history.state && history.state.s ? history.back() : goList();
  const feed = $('#feed');
  feed.onscroll = () => $('#jump').classList.toggle('on', feed.scrollHeight - feed.scrollTop - feed.clientHeight > 500);
  $('#jump').onclick = () => feed.scrollTo({top: feed.scrollHeight, behavior: 'smooth'});
  wireComposer(text => api('send', {num, text, images: attach, files: attachFiles}), (text, imgs) => { (pending[num] ||= []).push({text, imgs, t: Date.now()}); });
  renderSide(); headStatus(); loadThread();
}

function goList() { sel = null; setTimeout(connectEvents); if (location.hash) history.replaceState(null, '', location.pathname); $('#app').classList.remove('in'); renderSide(); }
// 实时推送：Mac 那边一有变化就推过来（列表 s、这个对话 t、正在写的回复 p），不再每几秒问一次
let es = null, esNum = -1, esOk = false, lastPoll = 0, partialText = '';
function connectEvents() {
  const n = sel || 0;
  if (es && esNum === n && es.readyState !== 2) return;
  if (es) es.close();
  esNum = n; esOk = false;
  es = new EventSource('/_x/api/events?num=' + n);
  es.onopen = () => { esOk = true; setOffline(false); };
  es.onerror = () => { esOk = false; };          // 浏览器会自己重连；期间退回定时问
  es.addEventListener('s', () => loadSessions());
  es.addEventListener('t', () => loadThread());
  es.addEventListener('p', e => { partialText = JSON.parse(e.data).text || ''; showPartial(); });
}
function showPartial() {
  const live = document.querySelector('.live'), feed = $('#feed');
  let el = document.querySelector('.live .partial');
  if (!live || !partialText) { if (el) el.remove(); return; }
  const near = feed && feed.scrollHeight - feed.scrollTop - feed.clientHeight < 160;
  if (!el) { el = document.createElement('div'); el.className = 'partial'; live.appendChild(el); }
  el.innerHTML = md(partialText) + '<i class="caret"></i>';

// 没放大时点空白、右上角 ×、返回手势都能关。电脑上滚轮缩放、双击放大。
function viewImage(src) {
  const el = document.createElement('div'); el.className = 'lightbox';
  el.innerHTML = `<img src="${esc(src)}" draggable="false"><button class="x" aria-label="关闭"><b>×</b>关闭</button>`;
  document.body.appendChild(el); history.pushState({lb: 1}, '', location.hash || location.pathname);
  const img = el.querySelector('img');
  let sc = 1, tx = 0, ty = 0, start = null, lastTap = 0, moved = false, closeTimer = 0;
  const W = () => innerWidth / 2, H = () => innerHeight / 2;
  const apply = (anim) => { img.style.transition = anim ? 'transform .2s' : 'none'; img.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
  const zoomAt = (ns, x, y) => {   // 以屏幕上 (x,y) 为中心缩放到 ns 倍
    ns = Math.min(6, Math.max(1, ns)); const cx = x - W(), cy = y - H();
    tx = cx - (cx - tx) * ns / sc; ty = cy - (cy - ty) * ns / sc; sc = ns; if (sc === 1) tx = ty = 0;
  };
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  el.addEventListener('touchstart', e => {
    moved = false;
    if (e.touches.length === 2) start = {d: dist(e.touches), s: sc, x: (e.touches[0].clientX + e.touches[1].clientX) / 2, y: (e.touches[0].clientY + e.touches[1].clientY) / 2, tx, ty};
    else start = {px: e.touches[0].clientX, py: e.touches[0].clientY, tx, ty};
  }, {passive: true});
  el.addEventListener('touchmove', e => {
    e.preventDefault(); moved = true; if (!start) return;
    if (e.touches.length === 2 && start.d) {
      sc = start.s; tx = start.tx; ty = start.ty; zoomAt(start.s * dist(e.touches) / start.d, start.x, start.y);
    } else if (e.touches.length === 1 && sc > 1 && start.px != null) {
      tx = start.tx + e.touches[0].clientX - start.px; ty = start.ty + e.touches[0].clientY - start.py;
    }
    apply(false);
  }, {passive: false});
  el.addEventListener('touchend', e => {
    if (e.touches.length) { start = {px: e.touches[0].clientX, py: e.touches[0].clientY, tx, ty}; return; }
    start = null;
    if (moved) return;
    const t = e.changedTouches[0], now = Date.now();
    if (now - lastTap < 300) { clearTimeout(closeTimer); zoomAt(sc > 1 ? 1 : 2.5, t.clientX, t.clientY); apply(true); lastTap = 0; e.preventDefault(); return; }
    lastTap = now;
    if (e.target.closest('.x')) { e.preventDefault(); return history.back(); }
    // 点在图片外面（没放大时）：等一下确认不是双击，就关掉
    if (sc === 1 && e.target !== img) { e.preventDefault(); clearTimeout(closeTimer); closeTimer = setTimeout(() => { if (sc === 1) history.back(); }, 300); }
  });
  el.addEventListener('wheel', e => { e.preventDefault(); zoomAt(sc * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY); apply(false); }, {passive: false});
  el.addEventListener('dblclick', e => { clearTimeout(closeTimer); zoomAt(sc > 1 ? 1 : 2.5, e.clientX, e.clientY); apply(true); });
  el.onclick = e => {
    if (e.target.closest('.x')) return history.back();
    if (e.target === img || sc > 1) return;
    clearTimeout(closeTimer); closeTimer = setTimeout(() => { if (sc === 1) history.back(); }, 320);   // 等等看是不是双击
  };
}

function shrink(file) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', .86));
    };
    img.src = url;
  });
}

    if ((!text && !attach.length && !attachFiles.length) || sending) return;
    sending = true; warn(''); btn.disabled = true; btn.innerHTML = '<i class="spin"></i>';
    // 一按发送就先显示在对话里（长文字带图上传要几秒），没发出去再撤回
    const shown = text || (attachFiles.length ? '[附件]' : '[图片]'), num0 = sel;
    if (onSent) { onSent(shown, attach.slice()); lastKey = ''; loadThread(); }
    const undo = () => { if (num0 && pending[num0]) pending[num0] = pending[num0].filter(p => p.text !== shown); lastKey = ''; loadThread(); };
    try {
      const r = await sendFn(text);
      if (r.ok) {
        ta.value = ''; attach = []; attachFiles = [];
        if (r.num) { sending = false; await loadSessions(); openSession(r.num); return; }
      } else { undo(); warn(r.error || '没发出去，再试一次'); }
    } catch (e) { undo(); if (e.message !== 'login') warn('没发出去，再试一次'); }
    sending = false; btn.innerHTML = ICON.up; sync(); lastKey = ''; loadThread(); loadSessions();
  }
  btn.onclick = go; sync();
}

const WHERE_ICON = {
  auto: '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
  course: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="m10 8.5 4 2-4 2z"/></svg>',
  folder: '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  plat: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10"/><path d="M7 8h6M7 12h10"/></svg>',
  chat: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>',
};
const FOLDER_SAY = {  // 设置里的文件夹短名 → 说人话；没列的按原名放在菜单最后
  '课程根': ['folder', '做新课或别的课', '课程文件夹'],
  '平台': ['plat', '改上课平台', '教师台、学生端、小信'],
};
function ago(t) {
  const d = Math.floor((Date.now() / 1000 - t) / 86400);
  return d < 1 ? '今天动过' : d < 2 ? '昨天动过' : `${d} 天前动过`;
}
// 新对话：和 Claude / ChatGPT 一样只有一个输入框；“在哪做”是输入框下面一个小按钮，默认小E 自动判断，要改才点开
function openNew(fromPop) {
  setTimeout(connectEvents);
  sel = null; if (!fromPop) navTo({n: 1}, '#new'); $('#app').classList.add('in'); renderSide();
  const said = Object.keys(FOLDER_SAY);
  const opts = [{v: 'auto', ic: 'auto', t: '自动', d: '小E 看你说的话选地方'},
    ...drafts.slice(0, 3).map(x => ({v: 'c:' + x.dir, ic: 'course', t: `接着做《${x.title}》`, d: ago(x.mtime)})),
    ...said.filter(f => folders.includes(f)).map(f => ({v: f, ic: FOLDER_SAY[f][0], t: FOLDER_SAY[f][1], d: FOLDER_SAY[f][2]})),
    {v: 'scratch', ic: 'chat', t: '不碰文件', d: '查资料、问问题'},
    ...folders.filter(f => !said.includes(f)).map(f => ({v: f, ic: 'folder', t: f, d: '文件夹'}))];
  let pick = 'auto', menu = false;
  $('#main').innerHTML = `<div class="head"><button class="icon-btn back" id="back">${ICON.back}</button><div class="ti"><b>新对话</b></div></div>
    <div class="newv"><h1>要做什么？</h1>${composerHTML('说说要做什么')}<div class="wbar" id="wbar"></div></div>`;
  $('#back').onclick = () => history.state && history.state.n ? history.back() : goList();
  const draw = () => {
    const cur = opts.find(o => o.v === pick), last = drafts[0] && opts.find(o => o.v === 'c:' + drafts[0].dir);
    $('#wbar').innerHTML = `<button class="pill ${pick !== 'auto' ? 'on' : ''}" id="wp">${WHERE_ICON[cur.ic]}<span>${esc(cur.v === 'auto' ? '在哪做：自动' : cur.t)}</span>${ICON.chev.replace('<svg', '<svg style="transform:rotate(90deg)"')}</button>`
      + (pick === 'auto' && last ? `<button class="pill" id="wlast">${WHERE_ICON.course}<span>${esc(last.t)}</span></button>` : '')
      + (menu ? `<div class="wmenu">${opts.map(o => `<button class="wo ${o.v === pick ? 'on' : ''}" data-v="${esc(o.v)}">${WHERE_ICON[o.ic]}
          <span class="tx"><b>${esc(o.t)}</b><small>${esc(o.d)}</small></span></button>`).join('')}</div>` : '');
    $('#wp').onclick = e => { e.stopPropagation(); menu = !menu; draw(); };
    if ($('#wlast')) $('#wlast').onclick = () => { pick = last.v; draw(); $('#ta').focus(); };
    document.querySelectorAll('.wo').forEach(c => c.onclick = e => { e.stopPropagation(); pick = c.dataset.v; menu = false; draw(); });
  };
  draw();
  $('#main').onclick = e => { if (menu && !e.target.closest('.wmenu')) { menu = false; draw(); } };
  const ms = {model: 'auto', effort: 'medium'}; let touched = false;
  renderModel(ms, () => { touched = true; }, true);
  const extra = () => ({...(ms.model !== 'auto' ? {model: ms.model} : {}), ...(touched ? {effort: ms.effort} : {})});
  wireComposer(text => api('send', {...(pick.startsWith('c:') ? {course: pick.slice(2)} : {folder: pick}), ...extra(), text, images: attach, files: attachFiles}));
  if (!matchMedia('(max-width:600px) and (pointer:coarse)').matches) $('#ta').focus();
}
$('#newBtn').onclick = () => openNew();
$('#fab').onclick = () => openNew();

// 屏幕键盘（或妙控键盘的悬浮快捷条）挡住底部时：页面保持满屏，只把输入条往上挪被挡住的那么多；
// 整页不滚，Safari 为露出输入框滚走的那段拉回来（不然会卡在半截、下面一片空白）
if (window.visualViewport) {
  const vv = visualViewport;
  const fit = () => {
    if (scrollX || scrollY) scrollTo(0, 0);
    // 用布局高度（clientHeight）算：iPhone 的 Safari 里 innerHeight 会跟着键盘一起变矮，拿它算会得 0
    const full = document.documentElement.clientHeight || innerHeight;
    const kb = Math.max(0, Math.round(full - vv.height - vv.offsetTop));
    document.documentElement.style.setProperty('--kb', kb + 'px');
    const t = $('#ta'); if (t && t.oninput) t.oninput();   // 键盘弹起后看得见的区域变小，输入框高度跟着收
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
  addEventListener('focusout', () => setTimeout(fit, 60));
}

(async () => {
  await loadSessions();
  const m = location.hash.match(/^#s(\d+)/);
  if (await openFromNotice()) {} else if (m) { history.replaceState(null, '', location.pathname); openSession(+m[1]); } else if (location.hash === '#new') { history.replaceState(null, '', location.pathname); openNew(); }
  // 实时推送连着时只偶尔兜底刷新；断了（换网络、锁屏回来）退回每几秒问一次
  connectEvents();
  setInterval(() => { if (!document.hidden && (!esOk || Date.now() - lastPoll > 20000)) { lastPoll = Date.now(); loadSessions(); } }, 4000);
  setInterval(() => { if (!document.hidden && !esOk) loadThread(); }, 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { connectEvents(); loadSessions(); loadThread(); openFromNotice(); } });
})();
</script></body></html>
