<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="远窗">
<meta name="theme-color" content="#d5dee5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2e3a45" media="(prefers-color-scheme: dark)">
<title>远窗</title>
<link rel="apple-touch-icon" href="/_x/icon.png"><link rel="manifest" href="/_x/manifest.json">
<style>
[hidden]{display:none!important}
:root{--bg:#fafaf9;--side:#f2f2ef;--panel:#fff;--bubble:#ebebe6;--ink:#1c1c1e;--mute:#6b6b70;--faint:#a3a3a8;--line:rgba(0,0,0,.08);
  /* 墨蓝：主色只用在“能点的、在进行的”；琥珀色只留给“等你定” */
  --acc:#2c4a74;--accsoft:rgba(44,74,116,.09);--acc-shadow:rgba(44,74,116,.28);--on-acc:#fff;
  --amber:#b07a06;--amber-soft:rgba(197,138,6,.10);--red:#c0392b;--green:#2f7d55;--glass:rgba(250,250,249,.82);--shadow:0 6px 24px rgba(0,0,0,.06);
  --toast-bg:#26282c;--toast-ink:#fff;--toast-acc:#a9c1e6;
  /* 字号只用这 5 档：小注、次要、正文小、正文、标题；iPad 整体大一档 */
  --t1:12.5px;--t2:14px;--t3:15.5px;--t4:16.5px;--t5:20px;--fs:var(--t4);
  /* 圆角：小控件、卡片、大面（气泡 / 输入框 / 弹层）、胶囊 */
  --r1:8px;--r2:14px;--r3:20px;--rf:999px}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--side:#1b1b1b;--panel:#222;--bubble:#2c2c2e;--ink:#ececec;--mute:#9b9b9b;--faint:#6e6e72;--line:rgba(255,255,255,.09);
  --acc:#8fb0de;--accsoft:rgba(143,176,222,.14);--acc-shadow:rgba(0,0,0,.4);--on-acc:#10203a;
  --amber:#f0bd4f;--amber-soft:rgba(240,189,79,.12);--red:#f08070;--green:#6fcf97;--glass:rgba(22,22,22,.82);--shadow:0 6px 24px rgba(0,0,0,.3);
  --toast-bg:#3a3a3c;--toast-ink:#f2f2f2;--toast-acc:#a9c1e6;
}}
html.ipad{--t1:13.5px;--t2:15px;--t3:16.5px;--t4:18px;--t5:21px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:var(--t4)/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:var(--acc);text-decoration:none}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:296px 1fr;height:100dvh}

/* 侧栏 */
.side{background:var(--side);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;padding:18px 14px 10px 20px}
.brand b{font-size:var(--t5);flex:1;letter-spacing:.5px}
.brand img{width:28px;height:28px;border-radius:var(--r1);margin-right:9px;flex:none}
.find{display:flex;align-items:center;gap:8px;height:38px;margin:8px 14px 4px;padding:0 12px;border-radius:var(--r2);background:var(--line);color:var(--mute)}
.find svg{width:16px;height:16px;flex:none} .find input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:max(16px,var(--t3));color:var(--ink);outline:none}
.find:focus-within{background:var(--panel);box-shadow:0 0 0 1.5px var(--acc)} .find .clr{display:none;color:var(--mute);font-size:var(--t5);line-height:1;padding:4px}
.find.has .clr{display:block}
.cats{display:flex;gap:6px;overflow-x:auto;padding:6px 14px 2px;scrollbar-width:none} .cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:30px;padding:0 12px;border-radius:var(--rf);border:1px solid var(--line);font-size:var(--t2);color:var(--ink);display:flex;align-items:center;gap:5px}
.cat small{color:var(--mute);font-size:var(--t1)} .cat.on{background:var(--ink);border-color:var(--ink);color:var(--bg)} .cat.on small{color:inherit;opacity:.65}
.item .more{display:none;flex:none;width:30px;height:30px;border-radius:var(--r1);color:var(--mute);place-items:center;font-size:var(--t4);letter-spacing:1px}
@media (hover:hover){.item:hover .more{display:grid} .item .more:hover{background:var(--line)}}
.item .hit{font-size:var(--t1);color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .item .ctag{margin-left:auto;font-size:var(--t1);color:var(--mute)}
mark{background:rgba(255,196,0,.35);color:inherit;border-radius:3px;padding:0 1px}
.amenu{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.3);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(16px + env(safe-area-inset-bottom))}
.amenu .box{width:min(420px,100%);background:var(--panel);border-radius:var(--r3);padding:8px;box-shadow:var(--shadow)}
.amenu .t{font-size:var(--t1);color:var(--mute);padding:8px 12px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amenu button{display:flex;align-items:center;gap:12px;width:100%;height:50px;font-size:var(--t4);padding:0 12px;border-radius:var(--r2);color:var(--ink);text-align:left}
.amenu button.on{color:var(--acc);font-weight:500} .amenu .v{margin-left:auto;font-size:var(--t2);color:var(--mute)}
.amenu .del{color:var(--red)} .amenu .sep{height:1px;background:var(--line);margin:4px 8px}
.amenu input{width:100%;height:46px;border-radius:var(--r2);border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:var(--t4);padding:0 12px;margin:4px 0 8px;box-sizing:border-box}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:80;background:var(--toast-bg);color:var(--toast-ink);border-radius:var(--rf);height:44px;display:flex;align-items:center;gap:6px;padding:0 6px 0 18px;font-size:var(--t3);white-space:nowrap;max-width:92vw}
.toast span{overflow:hidden;text-overflow:ellipsis} .toast button{color:var(--toast-acc);font-weight:500;padding:0 12px;height:36px;font-size:var(--t3)}
.sum{padding:0 20px 4px;color:var(--mute);font-size:var(--t2)} .sum .r{color:var(--acc)} .sum .w{color:var(--amber)}
.icon-btn{width:38px;height:38px;border-radius:var(--r1);display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--line)}
.scroll{overflow:auto;flex:1;padding:0 10px 20px}
.label{font-size:var(--t2);color:var(--mute);padding:14px 10px 6px}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border-radius:var(--r1);padding:9px 10px;color:var(--ink)}
.item.sel{background:var(--accsoft)}
.item .tx{min-width:0;flex:1}
.item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--t3)}
.item.sel .nm{font-weight:500}
.item .st{font-size:var(--t2);color:var(--mute);display:flex;align-items:center;gap:6px;margin-top:1px;min-width:0} .item .st .sx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--mute);flex:none}
.running .dot{background:var(--acc);border-color:var(--acc);animation:pulse 1.6s ease-in-out infinite}
.awaiting .dot{background:var(--amber);border-color:var(--amber)} .awaiting .st{color:var(--amber)}
.error .dot{background:var(--red);border-color:var(--red)}
.idle .dot,.queued .dot{display:none}
.unread .dot{display:block;background:var(--mute);border-color:var(--mute);width:6px;height:6px} .unread .nm{font-weight:500} .unread.idle .st{color:var(--ink)}
.paused .dot{display:block;background:transparent;border-color:var(--faint)} .paused .st{color:var(--mute)}
.suggest .st{color:var(--mute)}
.awaiting.unread .dot{background:var(--amber);border-color:var(--amber)}
.error.unread .dot,.error .dot{background:var(--red);border-color:var(--red)} .error .st{color:var(--red)}
/* 额度：一格一个数（5 小时 / 本周），数字在上、细条在下；有 GPT 时 Claude、GPT 各一列 */
.quota{padding:6px 14px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

.qm.hot .ql b{color:var(--amber)} .qm.hot .qb i{background:var(--amber)} .qr{font-size:var(--t1);color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.eng{flex:none;font-size:10.5px;font-weight:500;letter-spacing:.04em;line-height:15px;padding:0 5px;border-radius:5px;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.pill.warn{color:var(--amber);border-color:var(--amber)}
.notice{position:fixed;left:50%;top:calc(78px + env(safe-area-inset-top));transform:translate(-50%,-24px);opacity:0;z-index:20;display:flex;align-items:center;gap:10px;
  max-width:min(92vw,440px);padding:10px 16px;border-radius:var(--r2);background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);
  border:1px solid var(--line);box-shadow:var(--shadow);font-size:var(--t3);transition:transform .25s ease,opacity .25s,visibility .25s;cursor:pointer;visibility:hidden}
.notice.on{transform:translate(-50%,0);opacity:1;visibility:visible} .notice .dot{flex:none} .notice span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usage{position:absolute;right:16px;top:60px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow);padding:14px 16px;width:260px;display:flex;flex-direction:column;gap:12px}
.usage .qh{margin:0} .usage .w{font-size:var(--t2);color:var(--amber);line-height:1.5} .usage .pill{margin-top:2px}
@keyframes pulse{50%{opacity:.35}}

/* 主区 */
.main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:58px;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--line)}
.head .ti{flex:1;min-width:0} .head .ti b{display:block;font-size:var(--t4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .ti b.wt{display:flex;align-items:center;min-width:0} .head .ti b.wt .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .ti span{font-size:var(--t2);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.head .ti span.running{color:var(--acc)} .head .ti span.awaiting{color:var(--amber)} .head .ti span.error{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:var(--rf);border:1px solid var(--line);background:var(--panel);font-size:var(--t2);color:var(--ink)}
.pill:hover{border-color:var(--acc)} .pill svg{width:16px;height:16px}
.back{display:none}
.feed{flex:1;overflow:auto;padding:24px 20px calc(150px + var(--kb,0px));scroll-behavior:auto}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.you{align-self:flex-end;max-width:82%;background:var(--bubble);border-radius:var(--r3);padding:10px 16px;white-space:pre-wrap;word-break:break-word}
.you.pending{opacity:.85}
.cl{line-height:1.75;word-break:break-word}
.cl .md{font-size:var(--fs);line-height:1.8;letter-spacing:.01em}
.md>:first-child{margin-top:0} .md>:last-child{margin-bottom:0}
.md p{margin:0 0 .75em} .md h4{font-size:1.06em;font-weight:500;margin:1.3em 0 .45em}
.md h5{font-size:.82em;font-weight:500;color:var(--mute);letter-spacing:.06em;margin:1.35em 0 .3em}
.md ul,.md ol{margin:0 0 .8em;padding-left:1.4em} .md li{margin:.25em 0;padding-left:.15em} .md li::marker{color:var(--mute)}
.md b{font-weight:500} .md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md blockquote{margin:0 0 .8em;padding:.1em 0 .1em 1em;border-left:3px solid var(--line);color:var(--mute)}
.md pre{margin:0 0 .9em;padding:12px 14px;border-radius:var(--r2);background:var(--side);font:13.5px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.md .tw{overflow-x:auto;margin:0 0 .9em} .pi .pt .md,.pi.say .pt{white-space:normal} .pi.say .pt p{margin:0 0 .4em}
.ptog{display:inline-flex;align-items:center;gap:6px;font-size:var(--t2);color:var(--mute);margin-bottom:8px;padding:4px 0}
.ptog svg{width:15px;height:15px;transition:transform .15s} .ptog.open svg{transform:rotate(90deg)}
.plist{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;font-size:var(--t3);line-height:1.6}
.pi{display:flex;gap:10px;align-items:flex-start} .pi>svg{width:16px;height:16px;margin-top:4px;color:var(--mute)}
.pi .pt{min-width:0;flex:1;white-space:pre-wrap;word-break:break-word}
.pi.think .pt{color:var(--mute);font-style:italic}
.pi.do .pt{color:var(--mute)} .pi.do b{font-weight:500;color:var(--ink)}
.pi code.pd{display:block;margin-top:2px;white-space:pre-wrap;word-break:break-all;font-size:var(--t1)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.pt.wait{color:var(--mute)}
.tick{font-weight:inherit;font-variant-numeric:tabular-nums}
.yimgs{margin:0 0 6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end} .yimgs img{width:92px;height:92px;object-fit:cover;border-radius:var(--r1);display:block}
.qtag{display:block;margin-top:6px;font-size:var(--t2);color:var(--mute)}
.queue{color:var(--mute);font-size:var(--t3);padding:0 4px}
.plan{margin:10px 0 0;padding:10px 12px;border-radius:var(--r2);background:var(--bg);font-size:var(--t3)}
.plan .ah{color:var(--mute);font-size:var(--t2);margin-bottom:4px}
.ps{display:flex;align-items:center;gap:8px;padding:3px 0} .ps .spin{width:13px;height:13px} .ps .ok{color:var(--acc);width:13px;text-align:center}
.ps .n{width:13px;text-align:center;font-size:var(--t1);color:var(--mute)} .ps.done .an{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line)}
.ps.doing .an{font-weight:500} .ps .an{flex:1;min-width:0}
.agents{margin:10px 0 0;padding:10px 12px;border-radius:var(--r2);background:var(--bg);font-size:var(--t3)}
.agents .ah{color:var(--mute);font-size:var(--t2);margin-bottom:4px}
.ag{display:flex;align-items:center;gap:8px;padding:3px 0} .ag .spin{width:13px;height:13px}
.ag .an{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .ag .am{color:var(--mute);font-size:var(--t2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ag .ok{color:var(--acc);width:13px;text-align:center} .ag .bad{color:var(--red);width:13px;text-align:center} .ag.done .an,.ag.stopped .an{color:var(--mute)}
.pi.sub{padding-left:22px} .pi .who{font-style:normal;font-size:var(--t1);color:var(--acc);background:var(--accsoft);border-radius:var(--r1);padding:0 6px;margin-right:6px}
.live .lsub{margin-top:8px;color:var(--mute);font-size:var(--t3)}
.live .partial{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:var(--t3);line-height:1.65}
.caret{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-2px;background:var(--acc);border-radius:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.plist .pfull{align-self:flex-start;font-size:var(--t2);color:var(--acc);text-decoration:none}
.live .plist{margin:10px 0 0;max-height:46vh;overflow:auto;background:var(--bg)}
.cl .md table{border-collapse:collapse;font-size:.92em;line-height:1.6}
.cl .md td,.cl .md th{border-bottom:1px solid var(--line);padding:8px 16px 8px 0;text-align:left;vertical-align:top}
.cl .md th{font-weight:500}
.cl .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.note{align-self:center;font-size:var(--t2);color:var(--mute)}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px} .imgs img{max-width:min(100%,360px);max-height:300px;border-radius:var(--r2);border:1px solid var(--line);display:block}
.file{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);margin-top:8px;color:var(--ink);max-width:440px}
.file-row{display:flex;align-items:center;gap:12px;max-width:520px}.file-row .file{flex:1;min-width:0}.file-download{flex:none;font-size:var(--t2);padding:12px 4px;margin-top:8px}
.file:hover{border-color:var(--acc)} .file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .file .fs{color:var(--mute);font-size:var(--t2);flex:none}
.file svg{color:var(--acc)}
.chipf{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:var(--r1);background:var(--bg);border:1px solid var(--line);font-size:var(--t2);max-width:220px;position:relative}
.chipf span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
code{font:14px ui-monospace,Menlo,monospace;background:var(--line);padding:1px 5px;border-radius:var(--r1)}
.live{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;box-shadow:var(--shadow)}
.live .lh{display:flex;align-items:center;gap:10px}
.live .lh span{flex:1;font-weight:500}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--accsoft);border-top-color:var(--acc);animation:rot .9s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.live ol{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.live li{color:var(--mute);font-size:var(--t3);display:flex;gap:10px} .live li i{font-style:normal;min-width:22px;text-align:right}
.live li:last-child{color:var(--ink)}
.stop{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--rf);border:1px solid var(--line);font-size:var(--t2)}
.stop:hover{border-color:var(--red);color:var(--red)} .stop svg{width:14px;height:14px}
.ask{display:flex;flex-direction:column;gap:8px}
.ask .q{font-weight:500} .ask .ah{font-size:var(--t1);color:var(--faint);letter-spacing:.02em;margin-bottom:-2px}
.confirm{background:var(--panel);border:1px solid var(--amber);border-radius:var(--r2);padding:14px 16px;box-shadow:var(--shadow)}
.confirm .q{font-weight:500;font-size:var(--t3)}
.confirm pre{margin:8px 0 12px;white-space:pre-wrap;word-break:break-all;font:13.5px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border-radius:var(--r1);padding:8px 10px;max-height:160px;overflow:auto}

/* ═══ 远窗 · Pane 视觉（2026-11-02 定：雾面玻璃、干净；两套跟随系统；动效克制；墨蓝为主色；不用蓝紫渐变）═══
   原则（参考 Apple 材质规范、visionOS 设计规范、NN/g 对玻璃拟态可读性的研究）
   - 底是一层干净、平滑的冷灰雾，没有色团；颜色只出现在小的光点和图标上（像 logo 里那盏灯）。
   - 玻璃只有一层：卡片、输入框、按钮浮在雾上；不在玻璃上再叠玻璃（叠多了发灰发脏、字也看不清）。
   - 玻璃要“薄”：奶白半透明 + 顶边一道亮线 + 很淡的影子；按钮不用实心深色块，主按钮是更白一点的玻璃，墨蓝只在图标和字上。
   - 字要清楚：正文 400，标题可以细到 300；次要文字也要够深，不用浅灰压在灰上。
   - 状态是发光的点：墨蓝 = 在做，琥珀 = 等你定，红 = 出错，珍珠白 = 有新消息，空心环 = 暂停。琥珀不出现在别处。
   - 进度是“光轨”：一根发丝线，每一步一个节点；做完的亮着，正在做的那段有一道光往前走，没到的是空心环。 */
:root{
  --sky:linear-gradient(158deg,#d4e0ea 0%,#e1eaf1 38%,#ecf2f6 72%,#f3f6f9 100%);
  --bg:#e8eff4;--side:transparent;--panel:rgba(255,255,255,.82);--bubble:rgba(255,255,255,.72);
  --ink:#25313e;--mute:#566474;--faint:#8592a0;--line:rgba(24,44,64,.065);--hair:rgba(24,44,64,.14);
  --acc:#2c4a74;--acc-hi:#4a76b2;--acc-glow:rgba(74,118,178,.50);--accsoft:rgba(44,74,116,.07);--acc-shadow:rgba(44,74,116,.16);--on-acc:#fff;
  --amber:#8f620c;--amber-hi:#e0a536;--amber-glow:rgba(224,165,54,.55);--amber-soft:rgba(206,150,40,.10);
  --red:#a8402f;--red-hi:#e26b5a;--red-glow:rgba(226,107,90,.45);--green:#3c7c60;--pearl:#a3aeb9;
  /* 玻璃：card 卡片 / ctl 控件 / pop 弹层；都是奶白，透明度不同 */
  --card:rgba(255,255,255,.60);--ctl:rgba(255,255,255,.36);--ctl-hi:rgba(255,255,255,.72);
  --pop:rgba(250,252,253,.80);--edge:rgba(255,255,255,.92);--hi:rgba(255,255,255,.95);
  --glass:var(--ctl);--glass-hi:var(--ctl-hi);--glass-lo:rgba(255,255,255,.28);
  --blur:saturate(1.2) blur(20px);--veil:rgba(30,44,58,.12);
  --rim:inset 1px 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.72);
  --shadow:10px 18px 48px -12px rgba(92,124,168,.22),3px 6px 14px -6px rgba(92,124,168,.10);--lift:0 0 0 transparent;
  --float:10px 18px 48px -12px rgba(92,124,168,.22),3px 6px 14px -6px rgba(92,124,168,.10);
  --toast-bg:var(--pop);--toast-ink:var(--ink);--toast-acc:var(--acc);
  --r1:10px;--r2:18px;--r3:26px;--rf:999px;
  --ff:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root{
  --sky:linear-gradient(176deg,#151b22 0%,#11171d 50%,#0d1217 100%);
  --bg:#11171d;--panel:rgba(40,48,58,.9);--bubble:rgba(255,255,255,.075);
  --ink:#e6ebf0;--mute:#a3aeb9;--faint:#76828d;--line:rgba(255,255,255,.07);--hair:rgba(255,255,255,.12);
  --acc:#a9c4ea;--acc-hi:#8fb6ee;--acc-glow:rgba(130,172,236,.5);--accsoft:rgba(150,186,238,.10);--acc-shadow:rgba(0,0,0,.3);--on-acc:#0c1828;
  --amber:#e8c36f;--amber-hi:#f0c060;--amber-glow:rgba(240,192,96,.45);--amber-soft:rgba(240,192,96,.10);
  --red:#f0907f;--red-hi:#f08070;--red-glow:rgba(240,128,112,.4);--green:#7cc8a0;--pearl:#c3ccd5;
  --card:rgba(255,255,255,.045);--ctl:rgba(255,255,255,.035);--ctl-hi:rgba(255,255,255,.08);
  --pop:rgba(28,35,44,.88);--edge:rgba(255,255,255,.085);--hi:rgba(255,255,255,.11);
  --glass-lo:rgba(255,255,255,.035);--veil:rgba(0,0,0,.4);
  --shadow:10px 18px 48px -12px rgba(0,0,0,.5),3px 6px 14px -6px rgba(0,0,0,.3);--lift:0 0 0 transparent;
  --float:10px 18px 48px -12px rgba(0,0,0,.5),3px 6px 14px -6px rgba(0,0,0,.3);
  --rim:inset 1px 1px 0 rgba(255,255,255,.10),inset 0 0 0 1px rgba(255,255,255,.07)}}

/* ── 字 ── */
html,body{background:var(--sky) var(--bg);background-attachment:fixed;font-family:var(--ff);font-weight:400;letter-spacing:.01em}
b,strong,th{font-weight:500}
::placeholder{color:var(--faint)}
::selection{background:rgba(74,118,178,.20)}
svg{stroke-width:1.6}
.tick,.ql b,.quota-week b,.quota-detail-top b,.ag .am,.process-time,.sp-progress{font-variant-numeric:tabular-nums}
*{scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:var(--hair);border-radius:8px;border:2px solid transparent;background-clip:padding-box} ::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:none;box-shadow:var(--rim),0 0 0 3px var(--accsoft),0 0 0 1px var(--acc-hi)!important}

/* ── 侧栏：直接落在雾上 ── */
.side{background:transparent}
.brand{padding:20px 14px 12px 20px}
.brand .mk{width:30px;height:30px;border-radius:8px;margin-right:11px;flex:none;overflow:hidden;box-shadow:0 1px 3px rgba(24,44,64,.12),inset 0 0 0 .5px rgba(255,255,255,.5)}
.mk>svg{width:100%;height:100%;display:block} .mk>svg.d{display:none} @media (prefers-color-scheme:dark){.mk>svg.l{display:none}.mk>svg.d{display:block}}
.brand b{font-family:var(--fd);font-weight:400;font-size:20px;letter-spacing:.2em}
.icon-btn,.back{width:36px;height:36px;border-radius:50%;background:transparent;box-shadow:none;place-items:center;transition:background .2s}
.icon-btn{margin-left:6px} .icon-btn svg{width:18px;height:18px}
@media (hover:hover){.icon-btn:hover,.back:hover{background:var(--ctl-hi)}}
.sum{color:var(--mute);font-size:var(--t1)}
.find{background:var(--ctl);border:0;box-shadow:var(--rim);height:38px;border-radius:var(--rf);color:var(--faint);transition:background .2s,box-shadow .2s}
.find:focus-within{background:var(--ctl-hi);box-shadow:var(--rim),0 0 0 3px var(--accsoft)}
.cat{border:0;background:var(--glass-lo);box-shadow:var(--rim);color:var(--mute);height:28px;font-size:var(--t1)}
.cat.on{background:var(--ctl-hi);color:var(--ink);box-shadow:var(--rim),var(--lift)}
.label,.qh,.ask .ah,.plan .ah,.agents .ah,.mmenu .lb,.amenu .t{font-size:11.5px;color:var(--faint);font-weight:500;letter-spacing:.12em}
.label{padding:16px 10px 6px}
.item{border-radius:var(--r2);transition:background .2s,box-shadow .2s}
@media (hover:hover){.item:hover,.mo:hover,.amenu button:hover,.wo:hover,.blist .bo:hover{background:var(--glass-lo)}}
.item.sel{background:var(--card);box-shadow:var(--rim),var(--lift)}
.unread .nm{font-weight:500} .item.sel .nm{font-weight:400}
.item .st{color:var(--mute)}
.item .more{border-radius:50%}
.ccard,.ccard .cgo{border-radius:var(--r2)}

/* ── 光点 ── */
.dot{--c:var(--pearl);--g:transparent;position:relative;width:6px;height:6px;border:0;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.95) 0 22%,var(--c) 64%);box-shadow:0 0 3px 1px var(--g),0 0 9px 2px var(--g)}
.running .dot,.ccard.running .dot,.ccard.queued .dot{--c:var(--acc-hi);--g:var(--acc-glow);background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.95) 0 22%,var(--c) 64%);border:0;animation:none}
.running .dot::after,.ccard.running .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:radial-gradient(closest-side,var(--acc-glow),transparent);animation:halo 2.4s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:.9;transform:scale(1.3)}}
.awaiting .dot,.awaiting.unread .dot,.ccard.awaiting .dot{--c:var(--amber-hi);--g:var(--amber-glow);background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.95) 0 22%,var(--c) 64%);border:0}
.error .dot,.error.unread .dot{--c:var(--red-hi);--g:var(--red-glow);background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.95) 0 22%,var(--c) 64%);border:0}
.unread .dot{--c:var(--pearl);--g:rgba(140,160,180,.3);background:radial-gradient(circle at 50% 45%,#fff 0 25%,var(--c) 70%);border:0}
.paused .dot{background:transparent;box-shadow:inset 0 0 0 1px var(--faint)}
.offline i{width:6px;height:6px;background:radial-gradient(circle at 50% 45%,#fff 0 22%,var(--amber-hi) 64%);box-shadow:0 0 3px 1px var(--amber-glow),0 0 9px 2px var(--amber-glow)}

/* ── 转圈：一道绕圈的细光 ── */
.spin{border:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 45%,var(--acc-glow) 78%,var(--acc-hi));
  -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(closest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));
  animation:rot 1.1s linear infinite}
.send .spin{background:conic-gradient(from 0deg,transparent 0 45%,var(--acc-glow) 78%,var(--acc-hi))}

/* ── 进度：光轨 + 节点 ── */
.pbar{gap:0;align-items:center;padding:10px 4px 4px;margin-top:8px}
.pbar i{position:relative;flex:1;height:10px;border-radius:0;background:linear-gradient(var(--hair),var(--hair)) left center/calc(100% - 10px) 1px no-repeat;animation:none;opacity:1}
.pbar i::after{content:"";position:absolute;right:0;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--faint)}
.pbar i.done{background:linear-gradient(90deg,var(--acc-glow),var(--acc-hi)) left center/calc(100% - 10px) 1.5px no-repeat}
.pbar i.done::after{background:radial-gradient(circle at 50% 45%,#fff 0 20%,var(--acc-hi) 64%);box-shadow:0 0 3px 1px var(--acc-glow),0 0 8px 1px var(--acc-glow)}
.pbar i.doing{background:linear-gradient(var(--hair),var(--hair)) left center/calc(100% - 10px) 1px no-repeat;animation:none;opacity:1}
.pbar i.doing::before{content:"";position:absolute;left:0;right:10px;top:50%;height:1.5px;margin-top:-.75px;border-radius:2px;
  background:linear-gradient(90deg,transparent 0,transparent 35%,var(--acc-glow) 46%,var(--acc-hi) 50%,transparent 50.5%,transparent 100%) 0 0/200% 100% no-repeat;
  animation:comet 2.2s cubic-bezier(.45,.05,.55,.95) infinite}
.pbar i.doing::after{width:8px;height:8px;margin-top:-4px;box-shadow:inset 0 0 0 1.5px var(--acc-hi),0 0 6px 1px var(--acc-glow);animation:node 2.2s ease-in-out infinite}
@keyframes comet{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes node{0%,100%{box-shadow:inset 0 0 0 1.5px var(--acc-hi),0 0 2px 0 var(--acc-glow)}50%{box-shadow:inset 0 0 0 1.5px var(--acc-hi),0 0 9px 2px var(--acc-glow)}}
.plan,.agents,.live .plist{background:var(--glass-lo);box-shadow:inset 0 0 0 .5px var(--line)}
.ps .ok,.ag .ok{font-size:0;display:grid;place-items:center} .ps .ok::before,.ag .ok::before{content:"";width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#fff 0 20%,var(--acc-hi) 64%);box-shadow:0 0 5px 1px var(--acc-glow)}
.ps .n{color:var(--faint);font-size:11px} .ps.doing .an{font-weight:500} .ps.done .an{text-decoration:none;color:var(--faint)}
/* 额度：发丝线，满的那头一颗光点 */
.quota{border-top:1px solid var(--line)}
.ql b,.quota-week b{font-weight:400;font-family:var(--fd)}
.qb{height:1.5px;background:var(--hair);overflow:visible;margin-top:7px}
.qb i{position:relative;background:var(--acc-hi)}
.qb i::after{content:"";position:absolute;right:-2.5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,var(--acc-hi) 65%);box-shadow:0 0 5px 1px var(--acc-glow)}
.qm.hot .qb i,.quota-detail-row.hot .qb i{background:var(--amber-hi)} .qm.hot .qb i::after,.quota-detail-row.hot .qb i::after{background:radial-gradient(circle,#fff 0 20%,var(--amber-hi) 65%);box-shadow:0 0 5px 1px var(--amber-glow)}
.quota-detail-row.critical .qb i{background:var(--red-hi)} .quota-detail-row.critical .qb i::after{background:radial-gradient(circle,#fff 0 20%,var(--red-hi) 65%);box-shadow:0 0 5px 1px var(--red-glow)}
.eng{font-weight:500;font-size:10px;letter-spacing:.1em;box-shadow:inset 0 0 0 1px var(--hair);border-radius:var(--rf);padding:0 6px}

/* ── 主区：不再是一块板，内容直接在雾上，只有卡片和输入框浮起 ── */
.main{background:transparent}
.head{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:1px solid var(--line)}
.head .ti b{font-weight:500;color:var(--ink)} .head .ti b span{color:inherit;font-weight:inherit} .head .ti span,.item .st,.live .lsub,.facts{font-weight:300}
.head .ti span{color:var(--mute)}
.dock{background:none}
.blank{color:var(--mute)}
.blank .mk{display:block;width:64px;height:64px;margin:0 auto 20px;border-radius:15px;overflow:hidden;box-shadow:0 8px 24px rgba(24,44,64,.14),inset 0 0 0 .5px rgba(255,255,255,.5)}
.blank b{font-family:var(--fd);font-weight:300;font-size:28px;letter-spacing:.28em;margin:0 0 8px .28em}
.newv h1{font-family:var(--fd);font-weight:300;font-size:32px;letter-spacing:.06em;margin-bottom:24px}
.opening{background:var(--sky) var(--bg)}

/* ── 正文 ── */
.cl .md{line-height:1.85}
.md b{font-weight:500} .md h4{font-weight:500} .md h5{font-weight:500;color:var(--faint);letter-spacing:.12em}
.md li::marker{color:var(--faint)}
.md blockquote{border-left:2px solid var(--hair);color:var(--mute)}
.md pre,.md details.code{background:var(--glass-lo);box-shadow:inset 0 0 0 .5px var(--hair)} .md pre{font-family:var(--mono)}
.md details.code pre{box-shadow:none;background:none}
code{font-family:var(--mono);font-size:.88em;background:var(--glass-lo);box-shadow:inset 0 0 0 .5px var(--hair);border-radius:6px;padding:1px 6px}
.md hr{border-top-color:var(--hair)}
.cl .md th{font-weight:500;color:var(--mute);font-size:.88em} .cl .md td,.cl .md th{border-bottom-color:var(--line)}
mark{background:rgba(224,165,54,.25)}
.facts,.note,.qtag,.ymeta,.ptog{color:var(--mute)}
.pi.think .pt{font-style:normal}
.pi .who{background:var(--accsoft);border-radius:var(--rf);font-size:11px}
.caret{width:2px;border-radius:2px;background:var(--acc-hi)}

/* ── 玻璃卡片（只有一层）：你说的话、在做、确认、选项、文件、输入框 ── */
.you,.live,.confirm,.limit,.opt,.file,.plist,.composer{background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0;box-shadow:var(--rim),var(--lift)}
.you{border-radius:var(--r3) var(--r3) 8px var(--r3)}
.live,.confirm,.composer{border-radius:var(--r3)} .live{padding:16px 18px}
.plist{box-shadow:var(--rim)}
.live,.composer{box-shadow:var(--rim),var(--float)} .item.sel{box-shadow:var(--rim),3px 6px 18px -8px rgba(92,124,168,.18)} @media (prefers-color-scheme:dark){.item.sel{box-shadow:var(--rim)}}
.composer{transition:box-shadow .3s ease} .composer:focus-within{box-shadow:var(--rim),0 0 0 3px var(--accsoft),var(--float)}
.composer.drop{box-shadow:var(--rim),0 0 0 1px var(--acc-hi),0 0 0 4px var(--accsoft)}
.live .lh .lt,.live .lh span,.ask .q,.confirm .q,.limit .q{font-weight:400} .live .lsub .tick{font-weight:400;color:var(--ink)}
.live .partial{border-top-color:var(--line)}
.silence,.silence.stuck{color:var(--mute)}
.file svg{color:var(--acc)}
@media (hover:hover){.file:hover,.opt:hover{box-shadow:var(--rim),var(--shadow)}}
.opt{border-radius:var(--r2);transition:box-shadow .2s ease}
.opt .k{background:transparent;box-shadow:inset 0 0 0 1px var(--hair);color:var(--mute);font-weight:500}
.opt.rec .k{color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc-hi)} .opt .tag{color:var(--acc)}
.confirm pre{background:var(--glass-lo);box-shadow:inset 0 0 0 .5px var(--hair);font-family:var(--mono)}
.cwarn,.hint{color:var(--amber)}

/* ── 按钮：都是薄玻璃。普通的半透明；主按钮是更白、更实一点的玻璃，墨蓝只在图标和字上 ── */
.pill,.quick button,.jump,.stop,.chipf,.note.rw button,.mp{background:var(--ctl);border:0;box-shadow:var(--rim);transition:background .2s,box-shadow .2s}
.stop{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.mp{background:transparent;box-shadow:none;color:var(--mute)}
@media (hover:hover){.pill:hover,.quick button:hover,.jump:hover,.stop:hover,.mp:hover{background:var(--ctl-hi);box-shadow:var(--rim),var(--lift)}}
.mp.open{background:var(--ctl-hi);box-shadow:var(--rim)}
.pill.on{background:var(--accsoft);color:var(--acc);box-shadow:inset 0 0 0 .5px var(--accsoft)}
.pill.warn{color:var(--amber)}
.stop svg{width:10px;height:10px;color:var(--mute)} .stop:hover{color:var(--red)} .stop:hover svg{color:var(--red)}
.send,.fab,.confirm .cb .ok,.amenu button.on,.rewind-dialog .rewind-actions button.on,.sheet button.on,.schedule-dialog .on{
  background:rgba(44,74,116,.08);color:var(--acc);font-weight:500;box-shadow:inset 0 0 0 1px rgba(44,74,116,.14)}
@media (prefers-color-scheme:dark){.send,.fab,.confirm .cb .ok,.amenu button.on,.rewind-dialog .rewind-actions button.on,.sheet button.on,.schedule-dialog .on{
  background:rgba(169,196,234,.12);color:var(--acc);box-shadow:inset 0 0 0 1px rgba(169,196,234,.18)}}
.send svg,.fab svg{stroke-width:2}
.send{transition:transform .15s ease,box-shadow .25s,color .2s,background .2s} .send:active{transform:scale(.92)}
.send:disabled{background:transparent;color:var(--faint);box-shadow:none}
.fab{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:inset 0 0 0 1px rgba(44,74,116,.14),0 6px 20px rgba(24,44,64,.08)}
.confirm .cb button{background:var(--ctl);box-shadow:var(--rim)}
.thumb button{background:var(--pop);color:var(--ink);box-shadow:var(--rim),var(--lift)}
.note.rw{background:var(--accsoft)}
.ib{border-radius:50%} .ib.done{color:var(--acc-hi)}
@media (hover:hover){.ib:hover{background:var(--ctl)} .ib:hover::after{background:var(--pop);color:var(--ink);box-shadow:var(--rim),var(--lift);border-radius:var(--rf);padding:6px 10px}}

/* 朗读条 */
.speech-player{background:transparent;border-bottom:1px solid var(--line)}
.sp-play{color:var(--acc)} .sp-main button,.sp-download{border-radius:50%} .sp-main button:hover,.sp-download:hover{background:var(--ctl)}
.sp-title b{font-weight:500}
.sp-progress input{-webkit-appearance:none;appearance:none;background:transparent}
.sp-progress input::-webkit-slider-runnable-track{height:1.5px;background:var(--hair);border-radius:2px}
.sp-progress input::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4.75px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 .5px rgba(24,44,64,.2),0 1px 4px rgba(24,44,64,.2),0 0 0 3px var(--accsoft)}
.sp-progress input::-moz-range-track{height:1.5px;background:var(--hair)} .sp-progress input::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(24,44,64,.25)}

/* ── 弹出层 ── */
.wmenu,.mmenu,.usage,.amenu .box,.sheet .box{background:var(--pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0;border-radius:var(--r3);box-shadow:var(--rim),var(--shadow)}
.wmenu,.mmenu{border-radius:var(--r2)}
.amenu,.sheet{background:var(--veil)}
.amenu button,.mo,.wo,.blist .bo{border-radius:var(--r1)}
.mo b,.wo b,.dev b,.sheet b{font-weight:500} .mo.on,.wo.on{color:var(--acc)} .mo .ok{color:var(--acc)}
.seg button{background:var(--glass-lo);box-shadow:var(--rim)} .seg button.on{background:var(--ctl-hi);color:var(--acc);font-weight:500;box-shadow:var(--rim),var(--lift)}
.sheet button{background:var(--ctl);box-shadow:var(--rim)}
.sheet button.danger{background:var(--ctl);color:var(--red);box-shadow:var(--rim)}
.amenu input,.schedule-form input,.schedule-form textarea,.schedule-form select{background:var(--ctl);border:0;box-shadow:var(--rim),inset 0 0 0 1px var(--line);border-radius:var(--r1)}
.amenu input:focus,.schedule-form input:focus,.schedule-form textarea:focus,.schedule-form select:focus{outline:none;box-shadow:var(--rim),0 0 0 3px var(--accsoft)}
.blist,.amenu .browse .bx,.quota-dialog .quota-close,.schedule-dialog .schedule-head>button{background:var(--glass-lo);border:0;box-shadow:var(--rim)}
.dev .me{background:var(--accsoft);border-radius:var(--rf)}
.rewind-dialog h2,.quota-detail-head h2,.schedule-head h2{font-family:var(--fd);font-weight:400}
.rewind-dialog .rewind-actions button,.schedule-dialog .schedule-tools button{background:var(--ctl);box-shadow:var(--rim);border-radius:var(--rf)}
.rewind-option,.quota-detail-group+.quota-detail-group,.schedule-card,.dev{border-color:var(--line)}
.toast,.notice,.offline{background:var(--pop);color:var(--ink);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0;box-shadow:var(--rim),var(--shadow)}
.toast button{color:var(--acc);font-weight:500}

@media (min-width:821px){.side{box-shadow:inset -1px 0 0 var(--line)}}
@media (max-width:820px){
  .side,.main{background:transparent}
  .brand b{font-size:24px} .brand .mk{width:34px;height:34px;border-radius:9px}
  .fab{background:rgba(255,255,255,.7)}
}
/* 系统要求“降低透明度”时，玻璃都变实 */
@media (prefers-reduced-transparency:reduce){:root{--card:var(--panel);--ctl:var(--panel);--ctl-hi:var(--panel);--glass-lo:var(--panel);--pop:var(--bg)}}
@media (prefers-reduced-motion:reduce){.pbar i.doing::before,.pbar i.doing::after,.running .dot::after,.ccard.running .dot::after{animation:none}}

/* 状态光点：轻一点。小的实点 + 一圈很淡的光晕，没有珠子高光；在做的那圈光晕慢慢呼吸 */
.dot,.running .dot,.ccard.running .dot,.ccard.queued .dot,.awaiting .dot,.awaiting.unread .dot,.ccard.awaiting .dot,.error .dot,.error.unread .dot,.unread .dot{
  width:5px;height:5px;background:var(--c);box-shadow:0 0 0 2.5px var(--g),0 0 6px var(--g)}
.dot{--g:transparent}
.running .dot,.ccard.running .dot,.ccard.queued .dot{--c:var(--acc-hi);--g:rgba(74,118,178,.16)}
.awaiting .dot,.awaiting.unread .dot,.ccard.awaiting .dot{--c:#d9a441;--g:rgba(217,164,65,.18)}
.error .dot,.error.unread .dot{--c:var(--red-hi);--g:rgba(226,107,90,.16)}
.unread .dot{--c:#a9b5c1;--g:rgba(169,181,193,.18)}
@media (prefers-color-scheme:dark){.running .dot,.ccard.running .dot{--g:rgba(143,182,238,.16)} .awaiting .dot,.awaiting.unread .dot{--c:#e8c06a;--g:rgba(232,192,106,.16)}}
.running .dot::after,.ccard.running .dot::after{inset:-5px;background:radial-gradient(closest-side,rgba(74,118,178,.22),transparent);animation:halo 2.6s ease-in-out infinite}
.paused .dot{background:transparent;box-shadow:inset 0 0 0 1px var(--faint)}
/* 进度节点、步骤勾、额度光点同样轻一点 */
.pbar i.done::after,.ps .ok::before,.ag .ok::before{background:var(--acc-hi);box-shadow:0 0 0 2.5px rgba(74,118,178,.15)}
.pbar i.doing::after{box-shadow:inset 0 0 0 1.5px var(--acc-hi),0 0 0 3px rgba(74,118,178,.12);animation:none}
.qb i::after{background:var(--acc-hi);box-shadow:0 0 0 2px rgba(74,118,178,.15)}
.offline i{width:5px;height:5px;background:#d9a441;box-shadow:0 0 0 2.5px rgba(217,164,65,.18)}

.brand .mk,.blank .mk{box-shadow:0 1px 3px rgba(24,44,64,.10),0 0 0 .5px rgba(24,44,64,.14)}
@media (prefers-color-scheme:dark){.brand .mk,.blank .mk{box-shadow:0 0 0 .5px rgba(255,255,255,.12)}}

/* ═══ 第五版：对照参考图——扁平磨砂 ═══
   背景只有一层平滑的灰蓝渐变（右上深、左下浅）；卡片、按钮都是没有边、没有高光、没有影子的半透明磨砂板，
   靠和背景的一点明暗差分开；颜色只从“在做”卡片背后淡淡透出一小团。 */
:root{
  --sky:linear-gradient(200deg,#a9b9c4 0%,#c3cfd7 30%,#d9e1e4 62%,#e8eeec 100%);
  --bg:#d3dde2;
  --ink:#24323e;--mute:#566673;--faint:#7d8c98;--line:rgba(36,56,72,.08);--hair:rgba(36,56,72,.14);
  --plate:rgba(255,255,255,.40);--plate-hi:rgba(255,255,255,.56);--knob:rgba(255,255,255,.34);--knob-in:rgba(60,84,104,.07);
  --frost:saturate(1.15) blur(30px);
  --fd:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
@media (prefers-color-scheme:dark){:root{
  --sky:linear-gradient(200deg,#26323c 0%,#1b242c 40%,#13191e 100%);--bg:#161d23;
  --ink:#e2e8ed;--mute:#9eabb6;--faint:#6f7c87;--line:rgba(255,255,255,.06);--hair:rgba(255,255,255,.11);
  --plate:rgba(255,255,255,.055);--plate-hi:rgba(255,255,255,.085);--knob:rgba(255,255,255,.06);--knob-in:rgba(255,255,255,.06)}}
html,body{background:var(--sky) var(--bg);background-attachment:fixed}
/* 不要分隔线：侧栏、标题栏靠留白分开 */
.side{box-shadow:none!important} .head{border-bottom:0} .quota{border-top:0} .speech-player{border-bottom:0}
/* 磨砂板：卡片、你说的话、选项、文件、输入框、选中的对话 */
.live,.composer,.item.sel,.you,.opt,.file,.confirm,.limit,.plist{background:var(--plate);-webkit-backdrop-filter:var(--frost);backdrop-filter:var(--frost);box-shadow:none;border:0}
.composer{background:var(--plate-hi)}
.composer:focus-within{box-shadow:0 0 0 3px var(--accsoft)} .composer.drop{box-shadow:0 0 0 2px var(--acc-hi)}
.live,.composer,.confirm{border-radius:26px} .opt,.file,.item.sel{border-radius:20px}
@media (hover:hover){.file:hover,.opt:hover{background:var(--plate-hi);box-shadow:none}}
.opt.rec{background:var(--plate-hi);box-shadow:none}
.plan,.agents,.live .plist,.md pre,.md details.code,code,.confirm pre{background:var(--knob-in);box-shadow:none}
/* 圆形、胶囊按钮：扁平半透明，没有边 */
.find,.pill,.quick button,.jump,.cat,.stop,.chipf,.note.rw button,.seg button,.sheet button,.confirm .cb button,.rewind-dialog .rewind-actions button,.schedule-dialog .schedule-tools button,.blist,.amenu .browse .bx,.quota-dialog .quota-close,.schedule-dialog .schedule-head>button{
  background:var(--knob);box-shadow:none;border:0}
.live .stop,.opt .k,.composer .mp.open{background:var(--knob-in);box-shadow:none}
.opt .k{box-shadow:none} .opt.rec .k{background:var(--accsoft);box-shadow:none}
.icon-btn,.back{background:var(--knob)} .composer .ib,.composer .icon-btn{background:transparent}
@media (hover:hover){.pill:hover,.quick button:hover,.jump:hover,.stop:hover,.icon-btn:hover,.back:hover,.mp:hover{background:var(--plate-hi);box-shadow:none}}
.cat.on,.seg button.on{background:var(--plate-hi);box-shadow:none}
.pill.on{background:var(--accsoft);box-shadow:none}
/* 主按钮：淡淡一层墨蓝的磨砂圆，没有边 */
.send,.fab,.confirm .cb .ok,.amenu button.on,.rewind-dialog .rewind-actions button.on,.sheet button.on,.schedule-dialog .on{background:rgba(44,74,116,.12);color:var(--acc);box-shadow:none}
@media (prefers-color-scheme:dark){.send,.fab,.confirm .cb .ok,.amenu button.on,.rewind-dialog .rewind-actions button.on,.sheet button.on,.schedule-dialog .on{background:rgba(169,196,234,.14);box-shadow:none}}
.send:disabled{background:transparent}
.fab{background:var(--plate-hi);-webkit-backdrop-filter:var(--frost);backdrop-filter:var(--frost);box-shadow:none}
/* 弹层：更实一点的磨砂，只留很淡的影子把它和下面分开 */
.wmenu,.mmenu,.usage,.amenu .box,.sheet .box,.toast,.notice,.offline{background:rgba(236,241,243,.78);-webkit-backdrop-filter:var(--frost);backdrop-filter:var(--frost);box-shadow:0 20px 50px -20px rgba(40,60,80,.25)}
@media (prefers-color-scheme:dark){.wmenu,.mmenu,.usage,.amenu .box,.sheet .box,.toast,.notice,.offline{background:rgba(32,40,48,.86);box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}}
.amenu input,.schedule-form input,.schedule-form textarea,.schedule-form select{background:var(--knob-in);box-shadow:none}
/* “在做”的卡片：背后淡淡透出一小团墨蓝光，像参考图里卡片后面的光 */
.live{position:relative;isolation:isolate;overflow:hidden}
.live::before{content:"";position:absolute;z-index:-1;left:-6%;top:-70%;width:46%;height:170%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(92,128,190,.22),transparent);pointer-events:none}
@media (prefers-color-scheme:dark){.live::before{background:radial-gradient(closest-side,rgba(110,150,220,.16),transparent)}}
/* 字：标题细一点，数字用圆体（苹果设备上有） */
.brand b{font-family:var(--fd);font-weight:400}
.newv h1,.blank b{font-family:var(--fd);font-weight:300}
.live .lh .lt,.head .ti b{font-weight:500}

/* 第六版：底色提亮一档；状态不用灯、字不变色，颜色从玻璃后面透出来 */
:root{--sky:linear-gradient(200deg,#c2cfd8 0%,#d6dfe5 32%,#e5ebee 64%,#f0f4f3 100%);--bg:#dfe6ea;--plate:rgba(255,255,255,.46);--plate-hi:rgba(255,255,255,.60);
  --haze-run:rgba(74,118,178,.22);--haze-ask:rgba(226,172,82,.30);--haze-err:rgba(214,108,92,.22)}
@media (prefers-color-scheme:dark){:root{--sky:linear-gradient(200deg,#2e3a45 0%,#222c35 40%,#182027 100%);--bg:#222c35;--plate:rgba(255,255,255,.06);--plate-hi:rgba(255,255,255,.09);
  --haze-run:rgba(122,166,234,.20);--haze-ask:rgba(232,186,96,.20);--haze-err:rgba(238,139,124,.18)}}
/* 状态灯：小、淡、不发光，颜色和灰蓝底同一族（字本身不变色） */
.dot,.running .dot,.ccard.running .dot,.ccard.queued .dot,.awaiting .dot,.awaiting.unread .dot,.ccard.awaiting .dot,.error .dot,.error.unread .dot,.unread .dot{
  width:6px;height:6px;border:0;border-radius:50%;background:var(--c);box-shadow:none}
.running .dot::after,.ccard.running .dot::after{display:none}
.running .dot,.ccard.running .dot,.ccard.queued .dot{--c:#8aa5c9;animation:soft 3.2s ease-in-out infinite}
.awaiting .dot,.awaiting.unread .dot,.ccard.awaiting .dot{--c:#cdb27f}
.error .dot,.error.unread .dot{--c:#cf968c}
.unread .dot{--c:#aeb9c4}
.paused .dot{background:transparent;box-shadow:inset 0 0 0 1px var(--faint)}
@media (prefers-color-scheme:dark){.running .dot,.ccard.running .dot,.ccard.queued .dot{--c:#7f9bc2} .awaiting .dot,.awaiting.unread .dot,.ccard.awaiting .dot{--c:#bba277}
  .error .dot,.error.unread .dot{--c:#bd8b83} .unread .dot{--c:#647280}}
@keyframes soft{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.running .dot,.ccard.running .dot,.ccard.queued .dot{animation:none}}
/* 往左滑露出的删除 */
.swipe{position:relative;overflow:hidden;border-radius:20px}
.swipe>.item{position:relative;z-index:1;touch-action:pan-y}
.swdel{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:64px;height:40px;border:0;border-radius:999px;padding:0;cursor:pointer;
  background:#cf7f74;color:#fff;font:inherit;font-size:15px;font-weight:500;letter-spacing:.08em;opacity:0;pointer-events:none}
@media (prefers-color-scheme:dark){.swdel{background:#b36c63}}
/* 字一律原色 */

  const rest = compact && list.length > 3 ? list.length - at - shown.length : 0;

async function api(path, body) {
  let r;

  catch (e) { setOffline(true); throw e; }

// 带附件的发送：fetch 看不到上传进度，改用 XHR，边传边报“已传多少”
function upload(path, body, onProg) {
  return new Promise((ok, bad) => {
    const x = new XMLHttpRequest();
    x.open('POST', '/_x/api/' + path);
    const rawFiles = (body.files || []).some(f => f instanceof File);
    if (!rawFiles) x.setRequestHeader('Content-Type', 'application/json');
    x.upload.onprogress = e => { if (e.lengthComputable) onProg(e.loaded, e.total); };
    x.onerror = () => { setOffline(true); bad(new Error('上传连接中断，附件已保留，请保持页面打开后重试')); };
    x.onabort = () => bad(new Error('上传已中止，附件已保留'));
    x.ontimeout = () => bad(new Error('上传超时，附件已保留，请重试'));
    x.onload = () => {
      if (x.status === 401) { clearThreads(); location.href = '/_x/login?next=' + encodeURIComponent('/_x/' + location.hash); return bad(new Error('login')); }
      if ([502, 503, 504].includes(x.status)) { setOffline(true); return bad(new Error('offline')); }
      if (x.status === 413) return bad(new Error('big'));
      setOffline(false);
      if (x.status >= 400) return bad(new Error(`服务器接收失败（${x.status}），附件已保留`));
      try { ok(JSON.parse(x.responseText)); } catch (e) { bad(new Error('服务器返回异常，附件已保留，请重试')); }
    };
    if (rawFiles) {
      const form = new FormData();
      const {files, ...message} = body;
      form.append('message', JSON.stringify(message));
      for (const f of files) form.append('files', f, f.name);
      x.send(form);
    } else x.send(JSON.stringify(body));
  });
}

    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: raw});
    await api('push', sub.toJSON());
  };
  if (Notification.permission === 'granted') return subscribe().catch(() => {});

const threadCache = new Map();
try { for (const [n, v] of JSON.parse(localStorage.getItem('threads') || '[]')) threadCache.set(n, v); } catch (e) {}
function cacheThread(d) {
  threadCache.delete(d.num);
  threadCache.set(d.num, JSON.stringify({...d, live: null, decision: null}));   // 进行中、等你定这些只认新鲜的
  while (threadCache.size > 8) threadCache.delete(threadCache.keys().next().value);

}

}

async function loadThread() {
  if (!sel) return;
  try {
    const d = await api('thread/' + sel);
    if (d.num !== sel) return;
    cacheThread(d);
    const key = JSON.stringify(d) + JSON.stringify(pending[d.num] || []);
    const selText = getSelection && getSelection(); const reading = selText && !selText.isCollapsed && $('#feed') && $('#feed').contains(selText.anchorNode);

function shrink(file) {
  return new Promise((res, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', .86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

// 文字草稿持久化；照片和 File 原件保留在本页内存，切换对话不会丢。
const composerDrafts = new Map();
let composerView = null;

}

function wireComposer(sendFn, onSent, onOpening) {

    warning.hidden = !(state.error || state.progress);
    warning.textContent = state.error || state.progress;
    warning.classList.toggle('prog', !!state.progress && !state.error);
    thumbs.hidden = !state.images.length && !state.files.length;
    thumbs.innerHTML = state.images.map((u, i) => `<span class="thumb"><img src="${u}"><button data-i="${i}">×</button></span>`).join('')
      + state.files.map((f, i) => `<span class="thumb chipf">${ICON.doc}<span>${esc(f.name)}</span><button data-f="${i}">×</button></span>`).join('');
    thumbs.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { state.images.splice(+b.dataset.i, 1); paint(); });

    state.reading++; refreshComposer(key);
    try {
      for (const f of [...files]) {

        else state.files.push(f);

// 菜单按可见区域定位，避开标题栏和键盘；固定定位避免被新对话的滚动容器裁切。

    <div class="bbtns"><button class="pill" id="bup">← 上级</button><button class="pill" id="bhis">历史对话</button><button class="pill on" id="bok">用这个文件夹</button></div>`);

      up = d.parent || (d.drive_root ? '__drives__' : '');

      $('#bup').style.visibility = up ? 'visible' : 'hidden';
      $('#bok').style.display = $('#bhis').style.display = d.drive_level ? 'none' : '';
      $('#blist').innerHTML = d.dirs.map(n => `<button class="bo" data-n="${esc(n)}" ${d.absolute ? 'data-abs="1"' : ''}>${WHERE_ICON.folder}<span class="tx"><b>${esc(n)}</b></span></button>`).join('')
        || '<div class="bempty">这里没有子文件夹了</div>';
      document.querySelectorAll('#blist .bo').forEach(b => b.onclick = () => {
        at = b.dataset.abs ? b.dataset.n

        draw();

        const r = await api('resume-cc', {path: dir, session_id: b.dataset.sid, name: b.dataset.name}).catch(() => ({error: '没接上，再试一次'}));
        if (r.error || !r.num) { toast(r.error || '没接上，再试一次'); return; }

  $('#bhis').onclick = () => { $('#bup').style.visibility = 'hidden'; showSessions(at); };
  $('#bok').onclick = () => { el.remove(); done(at); };
  draw();
}

// 新对话：和 Claude / ChatGPT 一样只有一个输入框；“在哪做”是输入框下面一个小按钮，默认是上次用的文件夹，要换才点开
function openNew(fromPop, preset) {
  setTimeout(connectEvents);
  sel = null; if (!fromPop) navTo({n: 1}, '#new'); $('#app').classList.add('in'); renderSide();
  const seen = new Set(recent.map(r => r.path));
  const opts = [...recent.map(r => ({v: r.path, ic: 'folder', t: r.name, d: r.show})),
    ...folders.map(f => ({v: f, ic: 'folder', t: f, d: '常用文件夹'})).filter(o => !seen.has(o.v)),
    {v: 'scratch', ic: 'chat', t: '临时文件夹', d: '查资料、问问题，不碰你的文件'}];
  let pick = preset && opts.some(o => o.v === preset) ? preset : (lastFolder || 'scratch'), menu = false;
  $('#main').innerHTML = `<div class="head"><button class="icon-btn back" id="back">${ICON.back}</button><div class="ti"><b>新对话</b></div></div>
    <div class="newv"><h1>要做什么？</h1>${composerHTML('说说要做什么')}<div class="wbar" id="wbar"></div></div>`;
  $('#back').onclick = () => history.state && history.state.n ? history.back() : goList();
  const draw = () => {
    const cur = opts.find(o => o.v === pick) || {v: pick, ic: 'folder', t: pick};   // 手输的文件夹不在菜单里
    $('#wbar').innerHTML = `<button class="pill on" id="wp">${WHERE_ICON[cur.ic]}<span>${esc(cur.t)}</span>${ICON.chev.replace('<svg', '<svg style="transform:rotate(90deg)"')}</button>`
      + (menu ? `<div class="wmenu">${opts.map(o => `<button class="wo ${o.v === pick ? 'on' : ''}" data-v="${esc(o.v)}">${WHERE_ICON[o.ic]}
          <span class="tx"><b>${esc(o.t)}</b><small>${esc(o.d)}</small></span></button>`).join('')}
          <button class="wo" id="wbrowse">${WHERE_ICON.folder}<span class="tx"><b>浏览文件夹…</b><small>一层层点进去选</small></span></button>
          <form class="wcustom" id="wcustom"><input id="wtype" placeholder="其他文件夹：粘贴路径，或写文件夹名里的几个字" autocomplete="off"></form></div>` : '');
    if (menu) placeWhereMenu();
    $('#wp').onclick = e => { e.stopPropagation(); menu = !menu; draw(); };
    document.querySelectorAll('.wo').forEach(c => c.onclick = e => { e.stopPropagation(); if (c.id === 'wbrowse') return; pick = c.dataset.v; menu = false; draw(); });
    if ($('#wcustom')) {
      $('#wcustom').onclick = e => e.stopPropagation();
      $('#wcustom').onsubmit = e => { e.preventDefault(); const v = $('#wtype').value.trim(); if (v) { pick = v; menu = false; draw(); $('#ta').focus(); } };
    }
    if ($('#wbrowse')) $('#wbrowse').onclick = e => { e.stopPropagation(); browseSheet(pick, v => { pick = v; menu = false; draw(); $('#ta').focus(); }); };
  };
  draw();
  $('.newv').onscroll = placeWhereMenu;
  $('#main').onclick = e => { if (menu && !e.target.closest('.wmenu')) { menu = false; draw(); } };
  const ms = {model: 'auto', effort: 'medium'}; let touched = false;
  renderModel(ms, () => { touched = true; }, true);
  const extra = () => ({...(ms.model !== 'auto' ? {model: ms.model} : {}), ...(touched ? {effort: ms.effort} : {})});
  wireComposer((text, onProg, attachments) => sendApi({folder: pick, ...extra(), text, ...attachments}, onProg),
    null, (text, imgs) => {
      // 一按发送就进“正在开”：你的话先摆出来，说清楚在等什么、能不能走开（开好了自动进去）
      const old = $('#opening'); if (old) old.remove(); if (text === null) return;
      const el = document.createElement('div'); el.id = 'opening'; el.className = 'opening';
      el.innerHTML = `<div class="col"><div class="you">${youImgs(imgs || [])}${esc(text)}</div>
        <div class="live"><div class="lh"><i class="spin"></i><span class="lt">正在开新对话</span></div>
        <div class="lsub">已送到</div></div></div>`;
      $('.newv').appendChild(el);
    });
  if (!matchMedia('(max-width:600px) and (pointer:coarse)').matches) $('#ta').focus();
}
$('#newBtn').onclick = () => openNew();
$('#fab').onclick = () => openNew();

// 屏幕键盘（或妙控键盘的悬浮快捷条）挡住底部时：页面保持满屏，只把输入条往上挪被挡住的那么多；
// 整页不滚，Safari 为露出输入框滚走的那段拉回来（不然会卡在半截、下面一片空白）
if (window.visualViewport) {
  const vv = visualViewport;
  const fit = () => {
    if (scrollX || scrollY) scrollTo(0, 0);
    // 用布局高度（clientHeight）算：iPhone 的 Safari 里 innerHeight 会跟着键盘一起变矮，拿它算会得 0
    const full = document.documentElement.clientHeight || innerHeight;
    const kb = Math.max(0, Math.round(full - vv.height - vv.offsetTop));
    document.documentElement.style.setProperty('--kb', kb + 'px');
    const t = $('#ta'); if (t && t.oninput) t.oninput();   // 键盘弹起后看得见的区域变小，输入框高度跟着收
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
  addEventListener('focusout', () => setTimeout(fit, 60));
}

(async () => {
  await loadSessions();
  const m = location.hash.match(/^#s(\d+)/);
  if (await openFromNotice()) {} else if (m) { history.replaceState(null, '', location.pathname); openSession(+m[1]); } else if (location.hash === '#new') { history.replaceState(null, '', location.pathname); openNew(); }
  // 实时推送连着时只偶尔兜底刷新；断了（换网络、锁屏回来）退回每几秒问一次
  connectEvents();
  setInterval(() => { if (!document.hidden && (!esOk || Date.now() - lastPoll > 20000)) { lastPoll = Date.now(); loadSessions(); } }, 4000);
  setInterval(() => { if (!document.hidden && !esOk) loadThread(); }, 3000);
  document.addEventListener('visibilitychange', () => { presence(!document.hidden); if (!document.hidden) { connectEvents(); loadSessions(); loadThread(); openFromNotice(); } });
  // 键盘：⌘K 搜对话，⌘⇧O / ⌘N 新对话，⌘↑ ⌘↓ 上一个 / 下一个对话，Esc 回列表（手机上没键盘就用不到）
  addEventListener('keydown', e => {
    if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'k') { e.preventDefault(); if ($('#app').classList.contains('in') && matchMedia('(max-width:820px)').matches) goList(); $('#q').focus(); $('#q').select(); }
    else if (k === 'n' || (k === 'o' && e.shiftKey)) { e.preventDefault(); openNew(); }
    else if (k === 'arrowup' || k === 'arrowdown') {
      const nums = [...document.querySelectorAll('#list .item[data-n]')].map(b => +b.dataset.n); if (!nums.length) return;
      e.preventDefault(); const i = nums.indexOf(sel), j = i < 0 ? 0 : Math.max(0, Math.min(nums.length - 1, i + (k === 'arrowup' ? -1 : 1)));
      if (nums[j] !== sel) openSession(nums[j]);
    }
  });
})();
</script></body></html>
