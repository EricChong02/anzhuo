[project]
name = "anzhuo"
version = "0.1.0"
description = "案头：在手机或网页上给电脑里的 Claude Code / Codex 派活、收结果"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "claude-agent-sdk>=0.2.174",
    "dingtalk-stream>=0.24.3",
    "pywebpush>=2.5.0",
    "requests>=2.34.2",
    "tzdata>=2024.1",
]

[project.scripts]
anzhuo = "anzhuo:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
